         F("reg","Transformer regulation / no-load rise","%","15","15")],
 run(v){
   const {Vac,fline,I,Vripple,Vd,C,kripple,ESR,Rth,Tamb,Tmax,Irated,IsecFactor,Rinrush,Rbridge,reg} = v;
   if(!isFinite(Vac)||!isFinite(fline)||!isFinite(I)||!isFinite(Vripple)||!isFinite(Vd)||!isFinite(C)||
      !isFinite(kripple)||!isFinite(ESR)||!isFinite(Rth)||!isFinite(Tamb)||!isFinite(Tmax)||!isFinite(Irated)||
      !isFinite(IsecFactor)||!isFinite(Rinrush)||!isFinite(Rbridge)||!isFinite(reg)||
      Vac<=0||fline<=0||I<0||Vripple<=0||C<=0||kripple<=0||ESR<0||Rth<0||Tmax<=Tamb||Irated<=0||
      IsecFactor<=0||Rinrush<=0||Rbridge<0||reg<0) return null;
   const vPeak=Vac*Math.SQRT2-2*Vd;
   if(vPeak<=0) return [R("Bridge output",null,"","two diode drops exceed the transformer peak")];
   const cNeed=I/(2*fline*Vripple), cE24=e24AtLeast(cNeed);
   const ripple=I/(2*fline*C), vMin=vPeak-ripple;
   /* A reservoir capacitor is charged in narrow pulses. Its exact RMS current
      depends on transformer impedance and conduction angle, so the explicit
      multiplier keeps this thermal calculation honest and adjustable. */
   const iCapRms=kripple*I, pESR=iCapRms*iCapRms*ESR, tempRise=pESR*Rth, tCap=Tamb+tempRise;
   const rippleUse=iCapRms/Irated;
   const iSecondary=IsecFactor*I, transformerVA=Vac*iSecondary, bridgeLoss=2*Vd*I;
   const vacNoLoad=Vac*(1+reg/100), acPeak=Vac*Math.SQRT2, acPeakNoLoad=vacNoLoad*Math.SQRT2;
   const vPeakNoLoad=acPeakNoLoad-2*Vd;
   const bridgeTemp=Tamb+bridgeLoss*Rbridge, inrush=acPeakNoLoad/Rinrush;
   let capAdvice;
   if(rippleUse>1 || tCap>Tmax) capAdvice="Not suitable — use a larger or parallel 105°C high-ripple, low-ESR aluminum electrolytic.";
   else if(rippleUse>0.8 || tempRise>10) capAdvice="Use a 105°C high-ripple, low-ESR aluminum electrolytic and keep additional RMS-current margin.";
   else capAdvice="Use a 105°C aluminum electrolytic whose datasheet rating meets the calculated RMS ripple current; low-ESR is preferred.";
   return [R("Peak after bridge",vPeak,"V","transformer RMS × √2 minus two diode drops"),
           R("Capacitance needed",cNeed,"F","for the allowed peak-to-peak ripple"),
           R("Next E24 capacitance",cE24,"F","round upward for the ripple target"),
           R("Ripple with selected C",ripple,"V"),R("Minimum DC voltage",vMin,"V"),
           R("Equivalent load resistance",I>0?vMin/I:Infinity,"Ω","at minimum DC voltage"),
           R("No-load transformer secondary",vacNoLoad,"V","entered rated secondary plus transformer regulation"),
           R("Highest capacitor voltage (nominal mains)",vPeakNoLoad,"V","no-load secondary peak minus two diode drops"),
           R("Suggested capacitor voltage rating",1.25*vPeakNoLoad,"V","25 % margin; also check the highest mains voltage"),
           R("Transformer secondary RMS current",iSecondary,"A","load current × entered capacitor-input multiplier"),
           R("Minimum transformer rating",transformerVA,"VA","at the entered secondary voltage"),
           R("Suggested transformer rating",1.25*transformerVA,"VA","includes a 25 % VA margin"),
           R("Bridge dissipation",bridgeLoss,"W","two diode drops × DC load current"),
           R("Estimated bridge temperature",bridgeTemp,"°C","ambient + bridge loss × bridge thermal resistance"),
           R("Bridge PIV (ideal)",acPeakNoLoad,"V","one no-load transformer secondary peak"),
           R("Suggested bridge VRRM minimum",2*acPeakNoLoad,"V","2× no-load secondary peak margin; choose the next standard rating"),
           R("Estimated switch-on inrush",inrush,"A","cold capacitor at zero voltage; transformer impedance must be included"),
           R("Estimated capacitor ripple current",iCapRms,"A","RMS estimate: load current × entered multiplier; verify against the actual transformer and bridge"),
           R("Capacitor ESR dissipation",pESR,"W","I² × ESR, using ESR at the rectifier ripple frequency"),
           R("Estimated capacitor temperature rise",tempRise,"°C","ESR dissipation × thermal resistance to ambient"),
           R("Estimated capacitor core temperature",tCap,"°C","ambient plus estimated self-heating"),
           R("Ripple-current utilisation",100*rippleUse,"%","must remain below 100% of the datasheet RMS rating"),
           R("Capacitor recommendation",null,"",capAdvice)];
 }}
];

NEW_CALCS.concat(WIRE_CALCS, POWER_CALCS, AMP_CALCS, EXTRA_CALCS).forEach(c=>CALCS.push(c));
const GROUP_ORDER = ["Basics","Components","Filters","Op-amps","Power","Wire","Measurement"];
CALCS.sort((a,b)=> GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group));

function calcById(id){ return CALCS.find(c=>c.id===id) || CALCS[0]; }
function calcRun(c){
  const raw = ui.calcVals[c.id] || {};
  const v = {};
  c.fields.forEach(f=>{
    if(f.t==="text") v[f.k] = String(raw[f.k]||"").trim();
    else if(f.t==="sel") v[f.k] = (raw[f.k]!==undefined && raw[f.k]!=="") ? raw[f.k] : (f.def||f.opts[0]);
    else if(f.t==="check") v[f.k] = raw[f.k]!==undefined ? raw[f.k]===true || raw[f.k]==="true" : !!f.def;
    else {
      const entered = raw[f.k];
      const fallback = f.def!==undefined ? f.def : entered;
      v[f.k] = parseSI(entered!==undefined && entered!=="" ? entered : fallback, f.unit);
    }
  });
  try{ return c.run(v, raw); }catch(e){ return null; }
}
function calcDiagram(c){
  const f = DIAGRAMS[c.id];
  if(!f) return "";
  try{ return `<div class="schem"><div class="schem-head"><b>Live schematic</b><span>${esc(c.group)} · ${esc(c.id)}</span></div>${f(ui.calcVals[c.id]||{}, calcRun(c))}</div>`; }catch(e){ return ""; }
}
function calcOutHTML(c){
  const rows = calcRun(c);
  if(!rows) return `<p style="color:var(--ink3);font-size:13px;margin:0">Fill the boxes above.</p>`;
  return `<table><tbody>${rows.map(r=>{
      /* a row with no number carries its whole message in the note */
      const bare = (r.value===null || r.value===undefined || r.value==="");
      const val  = bare ? (r.note||"\u2014")
                        : (typeof r.value==="number" ? siFmt(r.value,r.unit)
                                                     : String(r.value)+(r.unit?" "+r.unit:""));
      return `<tr>
      <td style="width:46%">${esc(r.label)}${(!bare && r.note)?`<br><span style="color:var(--ink3);font-size:11px">${esc(r.note)}</span>`:""}</td>
      <td class="m" style="font-size:${bare?"12.5px":"15px"};font-weight:${bare?"400":"600"};color:${bare?"var(--ink2)":"inherit"}">${esc(val)}</td>
    </tr>`;}).join("")}</tbody></table>`;
}

function calcUnitHints(c){
  const seen = new Set(), out = [];
  for(const f of c.fields){
    if(f.t==="sel" || f.t==="text" || f.t==="check") continue;
    const u = String(f.unit||"").trim();
    if(!u || seen.has(u)) continue;
    seen.add(u);
    out.push((f.ph && /^[\d.]/.test(f.ph) ? f.ph : "10") + u);
  }
  return out;
}

function calcSeed(c){
  if(ui.calcVals[c.id]) return;
  const v = {};
  c.fields.forEach(f=>{ if(f.ph !== undefined && f.ph !== "") v[f.k] = String(f.ph); });
  ui.calcVals[c.id] = v;
}

function viewCalc(){
  const c = calcById(ui.calc);
  calcSeed(c);
  const raw = ui.calcVals[c.id] || {};
  const shownFields = c.fields.filter(f=>!f.showWhen || (raw[f.showWhen]!==false && raw[f.showWhen]!=="false"));
  return `<div class="panel"><h2>${esc(c.name)}</h2>
      ${c.note?`<p>${esc(c.note)}</p>`:""}
      <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        ${shownFields.map(f=>f.t==="check"
          ? `<div class="f checkfield${f.newRow?" newrow":""}"><label class="checkrow"><input type="checkbox" class="calcin" data-ck="${esc(f.k)}"${(raw[f.k]!==undefined ? raw[f.k]===true || raw[f.k]==="true" : !!f.def)?" checked":""}><span>${esc(f.label)}</span></label></div>`
          : `<div class="f${f.newRow?" newrow":""}">
          <label class="lab">${esc(f.label)}${f.unit?`<span class="field-unit">${esc(f.unit)}</span>`:""}</label>
          ${f.t==="sel"
            ? `<select class="calcin" data-ck="${esc(f.k)}">${f.opts.map(o=>{
                 const cur = (raw[f.k]!==undefined && raw[f.k]!=="") ? raw[f.k] : (f.def||f.opts[0]);
                 return `<option${o===cur?" selected":""}>${esc(o)}</option>`;}).join("")}</select>`
            : `<input class="calcin" data-ck="${esc(f.k)}" value="${esc(raw[f.k]!==undefined && raw[f.k]!=="" ? raw[f.k] : (f.def!==undefined ? f.def : ""))}" placeholder="${esc(f.ph||"")}"
                 inputmode="text" spellcheck="false" autocomplete="off">`}</div>`).join("")}
      </div>
      <div class="sheetbar"><button class="btn ghost" id="calcClear">Clear</button>
        <span style="color:var(--ink3);font-size:12px">${(()=>{ const u = calcUnitHints(c);
          return u.length ? `This page takes ${u.map(x=>`<span class="pn">${esc(x)}</span>`).join(" ")}
            — the unit is optional, and understood when it is there. ` : "";})()}Engineering
        notation works: <span class="pn">4k7</span> <span class="pn">100n</span> <span class="pn">10u</span>
        <span class="pn">1M</span> — capital M is mega, small m is milli.</span></div>
    </div>
    <div class="panel" id="calcOut">${calcDiagram(c)}${calcOutHTML(c)}</div>
    ${c.ref?`<div class="panel">${c.ref()}</div>`:""}`;
}

const ALIAS = {
  cable:"awg gauge resistivity", wire:"awg gauge resistivity", smd:"eia96",
  rc:"cutoff corner", lc:"resonant", buck:"smps", boost:"smps", ldo:"dropout",
  batt:"mah", divider:"potential thevenin loaded impedance", react:"impedance", rcolor:"stripes",
  shunt:"burden", zener:"clamp",
  adc:"sampling clamp protection error budget reference quantisation noise",
  opspeed:"op amp gbw bandwidth slew rate full power",
  bjt:"transistor base saturation gpio", rectifier:"bridge transformer mains reservoir smoothing inrush"
};

/* ----------------------------------------------------------------- render */
function viewAbout(){
  const short = u => esc(u.replace("https://",""));
  return `<div class="panel"><h2>Circuit Calcs ${esc(APP_VERSION)}</h2>
      <p>Twenty-nine bench calculators, each drawn as the circuit it is describing, with the drawing
         redrawn as you type. It is a single HTML file: no server to run, no build step, no account to
         make, no dependency to install. Open it in a browser and it works — from a hard disk, from a
         USB stick, or from any address you care to serve it at.</p>
      <p>The page loads nothing external — no CDN, no fonts, no analytics — and makes no network
         request of any kind. It works with the wire pulled out, and it will keep working long after
         anybody stops maintaining it.</p>
      <div class="sheetbar" style="margin-top:14px;flex-wrap:wrap">
        <a class="btn" target="_blank" rel="noreferrer" href="${esc(REPO_URL)}">Source on GitHub</a>
        <a class="btn ghost" target="_blank" rel="noreferrer" href="${esc(REPO_URL)}/releases/latest">Latest version</a>

      </div>
    </div>

         may stand in for the decimal point, the way it does on a schematic.</p>
      <p><b>Case matters, on purpose.</b> <span class="pn">M</span> is mega and
         <span class="pn">m</span> is milli, nine orders of magnitude apart on one character. Stating
         the unit is optional; the field says which one it expects.</p>
      <p>Every calculator opens with figures already in it, so it lands on a worked sum rather than a
         blank form. Clearing a box afterwards leaves it cleared.</p>
    </div>
    <div class="panel"><h2>Where the numbers stop</h2>
      <p>The cable calculator sizes a run for an allowed drop, reports the voltage actually reaching
         the load, and asks for the conductor temperature rather than assuming 20 °C — copper gains
         0.39 % per degree and a loaded cable is not cold. It gives watts per metre and refuses to
         print a temperature rise, because that depends on insulation, bundling and the air around it.</p>
      <p>For the same reason the AWG table carries diameter, cross-section and Ω/m and no current
         rating. A number invented there would be believed.</p>
    </div>
    <div class="panel"><h2>Linking to one</h2>
      <p>Each calculator has its own address, so one can be kept in a tab of its own or sent to
         somebody. The id is the one in the address bar when you open it:</p>
      <div class="kv">
        <b>calc.html#${esc(ui.calc)}</b>
        <span>the one you were last looking at — ${esc(calcById(ui.calc).name)}</span>
        <b>#about</b><span>this page</span>
      </div>
    </div>
    <div class="panel"><h2>What it remembers</h2>
      <p>The calculator you had open and what you typed into each, in this browser only, through

      <p>These were part of <b>Parts Bin</b>, a component inventory in a single HTML file, where they

         because somebody who prefers their own calculators can now ignore these without ignoring the
         inventory. The suggestion came from the EEVblog forum.</p>
      <p>Parts Bin links here from its own toolbar. Nothing is loaded across in either direction: the
         link opens a tab, and each page still works with no network at all.</p>
      <div class="sheetbar" style="flex-wrap:wrap">
        <a class="btn ghost" target="_blank" rel="noreferrer"
           href="https://ajengineering.github.io/parts-bin-app/">Try Parts Bin</a>
        <span class="pn" style="color:var(--ink3);font-size:12px">${short(BIN_URL)}</span>
      </div>
    </div>
    <div class="panel"><h2>Licence</h2>
      <p>MIT. Use it, change it, build on it, sell what you make with it — commercially or otherwise.

      <div class="kv">
        <b>author</b><span>Abdullah Jalloul</span>
        <b>source</b><span><a class="linkish" target="_blank" rel="noreferrer" href="${esc(REPO_URL)}">${short(REPO_URL)}</a></span>
        <b>licence</b><span><a class="linkish" target="_blank" rel="noreferrer" href="${esc(REPO_URL)}/blob/main/LICENSE">MIT</a></span>
        <b>issues</b><span><a class="linkish" target="_blank" rel="noreferrer" href="${esc(REPO_URL)}/issues">report a problem or ask for a calculator</a></span>

}

function render(){
  /* About is prose about the program, not about any one calculator, so the
     list goes and the text takes the width                               */
  const info = ui.view==="about";
  $("#rail").hidden = info;
  $("main").classList.toggle("solo", info);
  renderRail();
  $("#stage").innerHTML = info ? viewAbout() : viewCalc();
  $$("#views button").forEach(b=>b.classList.toggle("on", b.dataset.view===ui.view));
  save();
}

function renderRail(){
  const q = ui.q.trim().toLowerCase();
  /* the title is not always what someone types, so the field labels, their
     units and the dropdown entries are searched too - and past that, the
     words below, which appear nowhere in a calculator's own wording. Those
     were measured rather than guessed: every one of them found nothing.   */
  const hay = c => (c.name+" "+c.group+" "+c.id+" "+(c.note||"")+" "+(ALIAS[c.id]||"")+" "+
    (c.fields||[]).map(f=>f.label+" "+(f.unit||"")+" "+((f.opts||[]).join(" "))).join(" ")).toLowerCase();
  const hit = c => !q || hay(c).includes(q);
  const shown = CALCS.filter(hit);
  if(!shown.length){
    $("#cats").innerHTML = `<span style="color:var(--ink3);font-size:12px">Nothing matches "${esc(ui.q.trim())}".</span>`;
    return;
  }
  const groups = [...new Set(shown.map(c=>c.group))];
  $("#cats").innerHTML = groups.map(g=>
    `<div class="lab" style="margin:10px 0 4px">${esc(g)}</div>` +
    shown.filter(c=>c.group===g).map(c=>
      `<button class="cat${ui.calc===c.id?" on":""}" data-calc="${c.id}" title="${esc(c.name)}">
         <span>${esc(c.name)}</span></button>`).join("")
  ).join("");
}

/* ----------------------------------------------------------------- events */
document.addEventListener("click", ev=>{
  const t = ev.target;
  const vw = t.closest("[data-view]");
  if(vw){
    ui.view = vw.dataset.view;
    location.hash = ui.view==="about" ? "#about" : "#"+ui.calc;
    render(); window.scrollTo(0,0);
    return;
  }
  const ck = t.closest("[data-calc]");
  if(ck){ ui.calc = ck.dataset.calc; ui.view = "calc"; render(); window.scrollTo(0,0); return; }
  if(t.id==="calcClear"){
    delete ui.calcVals[ui.calc];
    render();
    return;
  }
});

const reRun = ()=>{
  const c = calcById(ui.calc);
  const out = $("#calcOut");
  if(out) out.innerHTML = calcDiagram(c) + calcOutHTML(c);
  save();
};
document.addEventListener("input", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){
    if(ev.target.type==="checkbox") return; // its change event rerenders dependent fields
    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.value;
    reRun();
    return;
  }
  if(ev.target.id==="q"){ ui.q = ev.target.value; renderRail(); }
});
document.addEventListener("change", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){
    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.type==="checkbox" ? ev.target.checked : ev.target.value;
    if(ev.target.type==="checkbox"){ render(); return; }
    reRun();
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault(); $("#q").focus(); $("#q").select(); return;
  }
  if(e.key==="Escape" && e.target.id==="q"){ ui.q=""; $("#q").value=""; renderRail(); }
});

/* A calculator can be linked to directly, so one of these can be sent to
   someone or kept in a browser tab of its own.                            */
function fromHash(){
  const hashId = decodeURIComponent(String(location.hash||"").replace(/^#/,"")).trim();
  const id = hashId==="dividerload" ? "divider" : hashId;
  if(id==="about"){ ui.view = "about"; return true; }
  if(id && CALCS.some(c=>c.id===id)){ ui.calc = id; ui.view = "calc"; return true; }
  return false;
}
window.addEventListener("hashchange", ()=>{ if(fromHash()) render(); });

try{
  load();
  migrateCalculatorIds();
  fromHash();
  render();
}catch(err){
  const d = document.createElement("pre");
  d.className = "fatal";
  d.textContent = "The page could not start:\n" + (err && err.stack ? err.stack : err) +
                  "\n\nSend this text back and it can be fixed.";
  document.body.appendChild(d);
}
</script>
