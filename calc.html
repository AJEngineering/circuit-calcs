/* ---------------------------------------------------------- wire and AWG --
   Resistivity in ohm.mm2/m at 20 degrees.                                   */
const RHO = {"Copper, pure":0.0172, "Copper, annealed IEC":0.017241, "Aluminium":0.0282,
             "CCA, 10 % copper":0.0271, "CCA, 15 % copper":0.0263, "Silver":0.0159, "Brass":0.071};
const DENS = {"Copper, pure":8.96, "Copper, annealed IEC":8.96, "Aluminium":2.70,
              "CCA, 10 % copper":3.32, "CCA, 15 % copper":3.63, "Silver":10.49, "Brass":8.5};
/* AWG n -> diameter in mm, the defining geometric series */
const awgDia = n => 0.127 * Math.pow(92, (36-n)/39);
const awgArea = n => Math.PI*Math.pow(awgDia(n),2)/4;
const AWG_NAME = n => n===-3?"4/0":n===-2?"3/0":n===-1?"2/0":n===0?"1/0":String(n);
/* AWG 24 is 0.511 mm across and 0.205 mm² in section. Quoting the area on its
   own invites reading it as the diameter - they are the two numbers a gauge
   is known by, so both are given, and the ⌀ says which is which.          */
const awgDesc = n => AWG_NAME(n)+"  ·  ⌀"+siFmt(awgDia(n),"mm")+"  ·  "+siFmt(awgArea(n),"mm²");
/* resistance of a metre of copper at that gauge, from the same figures */
const awgOhmPerM = n => RHO["Copper, pure"]/awgArea(n);

/* The gauge table, computed rather than copied: every number here comes from
   the defining series above and from copper's resistivity, so nothing can
   drift out of step with what the calculators work out. Current ratings are
   deliberately absent - those depend on insulation, bundling and ambient,
   and a number invented here would be trusted.                            */
function awgTableHTML(){
  const rows = [];
  for(let n=-3;n<=30;n++) rows.push(n);
  const cell = n => `<tr><td class="m"><b>${AWG_NAME(n)}</b></td>
      <td class="num m">${awgDia(n).toFixed(n<10?3:n<20?3:4)}</td>
      <td class="num m">${awgArea(n) >= 1 ? awgArea(n).toFixed(2) : awgArea(n).toFixed(4)}</td>
      <td class="num m">${siFmt(awgOhmPerM(n),"Ω")}</td></tr>`;
  const half = Math.ceil(rows.length/2);
  const table = list => `<table style="width:100%"><thead><tr><th>AWG</th>
      <th class="num asis">⌀ mm</th><th class="num asis">mm²</th><th class="num asis">Ω/m</th></tr></thead>
      <tbody>${list.map(cell).join("")}</tbody></table>`;
  return `<h2>American wire gauge</h2>
    ${noteHTML([
      "Diameter and section from the defining series. A gauge is quoted by both, and they are easy to confuse: AWG 24 is 0.511 mm across and 0.205 mm² in section.",
      "Ω/m is solid copper at 20 °C. A run of cable is twice its length, out and back.",
      "No current rating is given. That depends on the insulation, on whether the cable is bundled or in free air, and on the ambient — a single number here would be believed and would sometimes be wrong."
    ])}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 22px">
      ${table(rows.slice(0,half))}${table(rows.slice(half))}</div>`;
}
function awgFor(areaMM2){
  let best = null, bd = Infinity;
  for(let n=-3;n<=30;n++){
    const a = awgArea(n);
    if(a >= areaMM2 && (a-areaMM2) < bd){ bd = a-areaMM2; best = n; }
  }
  return best===null ? -3 : best;   /* smallest gauge that still carries it */
}

const WIRE_CALCS = [

{id:"wire", group:"Wire", name:"Wire resistance from diameter",
 note:[
  "R = \u03c1L/A, with A = \u03c0D\u00b2/4.",
  "Using the diameter where the area belongs is the common error: it drops the square, and understates the resistance badly on thin wire."
 ],
 fields:[F("L","Length","m","100"),F("D","Conductor diameter","mm","0.2"),
         FS("mat","Material",Object.keys(RHO),"Copper, pure"),
         F("Rm","Measured resistance (optional)","Ω","")],
 run(v){
   const {L,D,mat,Rm} = v;
   if(!isFinite(L)||!isFinite(D)||L<=0||D<=0) return null;
   const A = Math.PI*D*D/4;                       /* mm2 */
   const rho = RHO[mat] || RHO["Copper, pure"];
   const Rw = rho*L/A;                             /* not R - that is the row builder */
   const wrong = L/D*rho;                          /* the formula going round the internet */
   const out = [R("Cross section",A,"mm\u00b2","\u03c0D\u00b2 \u00f7 4 \u2014 the area, which is what carries the current"),
                R("Resistance",Rw,"\u03a9","\u03c1L \u00f7 A"),
                R("Per metre",Rw/L,"\u03a9","resistance \u00f7 length, in \u03a9/m"),
                R("Mass",(DENS[mat]||8.96)*A*L/1000,"kg","density \u00d7 area \u00d7 length \u2014 the whole run"),
                R("Nearest AWG",null,"", awgDesc(awgFor(A))),
                R("The (L/D) \u00d7 \u03c1 formula gives",wrong,"\u03a9",
                  "wrong by "+(Rw/wrong).toFixed(2)+"\u00d7 \u2014 it treats a diameter as an area")];
   if(isFinite(Rm) && Rm>0){
     const ratio = Rm/Rw;
     out.push(R("Measured \u00f7 expected",ratio,"\u00d7","what you measured, over \u03c1L \u00f7 A"));
     out.push(R("Verdict",null,"",
       ratio < 1.12 ? "consistent with solid copper"
       : ratio < 1.35 ? "high \u2014 check the length and the diameter before blaming the metal"
       : "far too high for copper \u2014 aluminium or CCA behaves like this"));
     out.push(R("Implied resistivity",Rm*A/L,"","\u03a9\u00b7mm\u00b2/m \u00b7 copper is 0.0172, aluminium 0.0282"));
   }
   return out;
 }},

{id:"cable", group:"Wire", name:"Cable size & voltage drop",
 note:[
  "Sizing a run for a current and an acceptable drop. Give the length one way; the calculation uses the round trip.",
  "Conductor temperature is asked for rather than assumed. Copper gains about 0.39 % per degree, so a loaded cable drops more than a cold one.",
  "How hot it actually gets depends on the insulation, on whether the run is bundled or in free air, and on the ambient \u2013 which is why that is yours to say. The watts per metre below are what has to escape."
 ],
 tbl:"awg",
 fields:[F("I","Current","A","32"),F("L","One way length","m","15"),F("V","System voltage","V","230"),
         F("drop","Allowed drop","%","3"),F("A","Or a cross section you already have","mm²",""),
         F("T","Conductor temperature","°C","70")],
 run(v){
   const {I,L,V,drop,A,T} = v;
   if(!isFinite(I)||!isFinite(L)||I<=0||L<=0) return null;
   const rho = RHO["Copper, pure"];
   /* Copper gains about 0.39 % per degree, so a warm cable drops more than a
      cold one and the sum has to be done at the temperature the conductor
      actually runs at - which is why it is asked for rather than assumed. */
   const Tc = isFinite(T) ? T : 20;
   const kT = 1 + 0.00393*(Tc-20);
   const out = [];
   if(isFinite(V)&&isFinite(drop)&&drop>0){
     const vd = V*drop/100;
     /* sized at the temperature the conductor runs at, not at 20 \u00b0C - a warm
        cable is more resistive, so holding the same drop takes more copper,
        and sizing it cold is how a run ends up marginal in service        */
     const need = 2*(rho*kT)*L*I/vd;
     const n = awgFor(need);
     out.push(R("Allowed drop",vd,"V",drop+" % of "+siFmt(V,"V")),
              R("Voltage at the load",V-vd,"V","if the cable is sized exactly to that"),
              R("Cross section needed",need,"mm\u00b2","2\u03c1(T) \u00d7 L \u00d7 I \u00f7 allowed drop, the 2 for out and back \u2014 for "+drop+" % at "+siFmt(V,"V")+
                (Math.abs(Tc-20)>=1 ? ", conductor at "+siFmt(Tc,"")+" \u00b0C" : "")),
              R("Nearest AWG",null,"", awgDesc(n)),
              R("Next metric size",null,"", [1,1.5,2.5,4,6,10,16,25,35,50,70,95].find(x=>x>=need)+" mm\u00b2"));
   }
   if(isFinite(A)&&A>0){
     const Rw = 2*rho*L/A, vd = Rw*I;
     /* the drop is what the cable takes; the load only ever sees what is
        left, and that is the number the thing on the end has to work on  */
     const RwH = Rw*kT, vdH = RwH*I;
     out.push(R("Loop resistance",Rw,"\u03a9","2\u03c1L \u00f7 A at 20 \u00b0C \u2014 the 2 is out and back"),
              R("Drop at this current",vd,"V","loop resistance \u00d7 I, cold"),
              R("Drop",isFinite(V)?100*vd/V:null,"%", "drop \u00f7 supply \u00d7 100"+(isFinite(V)&&100*vd/V>3?" \u2014 over the usual 3 % limit":"")));
     if(isFinite(V)) out.push(R("Voltage at the load",V-vd,"V",
       V-vd<=0 ? "the cable eats the whole supply \u2014 the run is far too thin"
               : "what the load actually receives with this cable fitted"));
     /* at 20 \u00b0C the warm figures are the cold ones again - saying them twice
        just buries the rows that differ                                    */
     if(Math.abs(Tc-20) >= 1){
       out.push(R("Loop resistance at "+siFmt(Tc,"")+" \u00b0C",RwH,"\u03a9","the 20 \u00b0C value \u00d7 (1 + 0.00393 \u00d7 (T \u2212 20)) \u2014 copper climbs about 0.39 % per degree"),
                R("Drop when warm",vdH,"V","the case that matters \u2014 a loaded cable is not at 20 \u00b0C"));
       if(isFinite(V)) out.push(R("Voltage at the load when warm",V-vdH,"V"));
     }
     out.push(R("Heat in the cable",vdH*I,"W","warm drop \u00d7 I, at "+siFmt(Tc,"")+" \u00b0C"),
              R("Heat per metre",vdH*I/(2*L),"W","heat \u00f7 (2 \u00d7 length) \u2014 both legs counted; this is what has to escape"));
   }
   return out.length?out:null;
 }}
];

 note:[
  "Conduction and switching losses, with a first-pass check on the gate drive. The Miller estimate comes from QGD and the total gate resistance, so read it against the switching waveforms in the datasheet rather than instead of them.",
  "Picking a device fills the tinted boxes and nothing else: Rds(on), Qg, QGD, the plateau, the internal gate resistance, the ratings and the package's thermal figure. The plain boxes are the board \u2013 the rail, the current, the duty, the frequency, the drive and the thermal path you actually built.",
  "Every one of those figures is quoted at a single gate voltage, which is carried in its own field. Drive the part anywhere else and Rds(on), Qg and QGD all move; the page says so rather than scaling them by a factor it has no way to know. Take the numbers off the curve at your own VGS and type them in.",
  "Rds(on) climbs with temperature, and by how much is a property of the die. The multiplier is a field, not a constant: read it off the Rds(on)-versus-temperature curve at the junction temperature you expect.",
  "The \u03b8JA a device brings with it is that package on the datasheet's own test board, in still air, with nothing bolted to it. Fit a heatsink and the figure to enter is \u03b8JC + \u03b8CS + \u03b8SA instead \u2013 never \u03b8JA.",
  "A P-channel part is the same arithmetic with every sign reversed. Enter magnitudes, and read the drawing as the shape rather than the polarity.",
  "Where a datasheet publishes nothing \u2013 an internal gate resistance, most often \u2013 the field is left empty rather than filled with a plausible number, and what that costs the estimate is said beside it. Everything here is a starting point: check it against the datasheet you are building to."
 ],
 fields:[FS("part","Device – fills the device figures only",["— enter values by hand —","2N7002 · 60 V N-ch SOT-23","BSS138 · 50 V N-ch SOT-23","Si2302 · 20 V N-ch SOT-23","AO3400A · 30 V N-ch SOT-23","AO3401A · -30 V P-ch SOT-23","IRLZ44N · 55 V logic-level TO-220","IRFZ44N · 55 V N-ch TO-220","IRF540N · 100 V N-ch TO-220","IRF9540N · -100 V P-ch TO-220","IRF740 · 400 V N-ch TO-220","IRFP260N · 200 V N-ch TO-247","NCEP020N10LL · 100 V N-ch TOLL","SED3022M · 30 V dual N-ch DFN3x3"],"— enter values by hand —"),
         F("Vds","Switched voltage","V","400"),F("Id","Drain current","A","2"),
         F("D","Duty cycle","%","40"),F("f","Switching frequency","Hz","65k"),
         F("Rds","Rds(on)","Ω","0.3"),F("tsw","Rise + fall time","s","60n"),
         F("Qg","Gate charge","C","20n"),F("Vg","Gate drive","V","12"),
         F("Rja","θJA still air, or θJC + heatsink","°C/W","62"),F("Ta","Ambient","°C","40"),
         F("Qgd","Miller gate charge QGD","C","8n","8n",true),F("Vplateau","Miller plateau voltage","V","5","5"),
         F("Rg","External gate resistor","Ω","10","10"),F("Rdrv","Driver source/sink resistance","Ω","2","2"),
         F("Rgi","MOSFET internal gate resistance – often unpublished","Ω","",""),
         F("Vdsmax","Device VDS max (optional)","V",""),F("Idmax","Device ID max (optional)","A",""),
         F("Vgsq","Datasheet figures quoted at VGS","V",""),
         F("khot","Rds(on) hot ÷ cold, from the datasheet curve","×","1.4")],
 tbl:"packages",
 run(v){
    const {Vds,Id,D,f,Rds,tsw,Qg,Vg,Rja,Ta,Qgd,Vplateau,Rg,Rdrv,Rgi,Vdsmax,Idmax,Vgsq,khot} = v;
    /* A P-channel part is this arithmetic with every sign reversed, so the
       page works in magnitudes throughout and the drawing stays the one
       N-channel symbol. Enter the numbers as sizes, not as signs.      */
    const aVds = Math.abs(Vds), aId = Math.abs(Id), aVg = Math.abs(Vg);
   if(!isFinite(Id)||!isFinite(Rds)) return null;
   const d = isFinite(D) ? D/100 : 1;
    const kh = (isFinite(khot) && khot > 0) ? khot : 1.4;
    const pc = aId*aId*Rds*d;
   const out = [R("Conduction loss",pc,"W","Id\u00b2 \u00d7 Rds(on) \u00d7 duty"),
                 R("Conduction loss when hot",pc*kh,"W","Rds(on) \u00d7 "+kh+" \u2013 read that multiplier off the Rds(on)-versus-temperature curve for your part and your junction temperature; silicon runs from about 1.3 to 2 and no single figure fits every device")];
    /* A switch that never switches. Everything paid per cycle goes to zero,
       and printing a column of zeros hides the one loss that is left. The
       gate figures still describe the single transition, so they stay.   */
    const dc = !isFinite(f) || f<=0;
    if(dc) out.push(R("Held on",null,"","no switching: the only loss is conduction, and Rds(on) rises with temperature, which raises it again"));
    /* The rail and the load current are yours; the ratings belong to the
       part. Picking a device therefore leaves the circuit alone and says
       plainly when the circuit is outside what the part can take - which
       a page full of neat wattages would otherwise hide.               */
    if(isFinite(Vdsmax)&&Vdsmax>0&&isFinite(aVds)){
      if(aVds>Vdsmax) out.push(R("Over the drain rating",null,"","the switched voltage is "+siFmt(aVds,"V")+" and the device is rated "+siFmt(Vdsmax,"V")+" – it will avalanche"));
      else out.push(R("Drain-source margin",aVds/Vdsmax*100,"%","switched voltage \u00f7 rating \u00d7 100, of the "+siFmt(Vdsmax,"V")+" rating; leave room for the spike the layout adds at turn-off"));
    }
    if(isFinite(Idmax)&&Idmax>0&&isFinite(aId)){
      if(aId>Idmax) out.push(R("Over the current rating",null,"","the drain current is "+siFmt(aId,"A")+" and the device is rated "+siFmt(Idmax,"A")));
      else out.push(R("Drain current margin",aId/Idmax*100,"%","drain current \u00f7 rating \u00d7 100, of the "+siFmt(Idmax,"A")+" rating, itself quoted at a case temperature you will not have"));
    }
    /* Rds(on), Qg and QGD are all quoted at one gate voltage. Driving the
       part somewhere else changes every one of them, and not by a factor
       this page can know: below the quoted voltage Rds(on) rises steeply
       and the losses here are optimistic. Naming the mismatch is honest;
       inventing a correction would not be.                            */
    if(isFinite(Vgsq) && Vgsq>0 && isFinite(aVg) && Math.abs(aVg-Vgsq) > 0.05*Vgsq){
      out.push(R("Gate drive is not the datasheet's",null,"",
        "the figures above are quoted at VGS = "+siFmt(Vgsq,"V")+" and the drive is "+siFmt(aVg,"V")+
        (aVg<Vgsq ? " \u2013 Rds(on) will be higher than the figure used here, Qg and QGD lower, so the conduction loss is understated"
                  : " \u2013 Qg and QGD will be higher than the figures used here, so the gate-drive loss is understated")+
        ". Take the numbers off the curve at your own gate voltage and type them in."));
    }
   let ps = 0, pg = 0;
   if(!dc && isFinite(Vds)&&isFinite(f)&&isFinite(tsw)){
     ps = 0.5*aVds*aId*tsw*f;
     out.push(R("Switching loss",ps,"W","\u00bd \u00d7 Vds \u00d7 Id \u00d7 (tr+tf) \u00d7 f"));
   }
   if(!dc && isFinite(Qg)&&isFinite(Vg)&&isFinite(f)){
     pg = Qg*aVg*f;
     out.push(R("Gate-driver average current",Qg*f,"A","Qg × switching frequency"),
              R("Gate drive loss",pg,"W","paid by the driver, not the FET"));
   }
   if(isFinite(Qgd)&&isFinite(Vplateau)&&isFinite(Vg)&&isFinite(Rg)&&isFinite(Rdrv) &&
      Qgd>0&&Rg>=0&&Rdrv>=0&&aVg>Vplateau){
      const rgi = isFinite(Rgi) ? Rgi : 0;
      const rGate=Rg+Rdrv+rgi, iPeak=aVg/rGate, iMiller=(aVg-Vplateau)/rGate;
     const tMiller=Qgd/iMiller, tEstimated=2*tMiller;
      out.push(R("Total gate resistance",rGate,"Ω", isFinite(Rgi)
                 ? "external resistor + driver + the MOSFET's own"
                 : "external resistor + driver only – no internal gate resistance entered, and many datasheets never publish one, so the transition times below are optimistic"),
              R("Peak gate current",iPeak,"A","drive voltage ÷ total gate resistance — at the beginning of the gate-charge pulse"),
              R("Miller plateau current",iMiller,"A","(drive − plateau voltage) ÷ total gate resistance — this is what sets the drain-voltage transition speed"),
              R("Estimated Miller time",tMiller,"s","QGD ÷ Miller plateau current"),
              R("Estimated rise + fall time",tEstimated,"s","two Miller transitions"));
     if(!dc && isFinite(Vds)&&isFinite(Id)&&isFinite(f))
       out.push(R("Miller-estimated switching loss",aVds*aId*tMiller*f,"W",
         "VDS × ID × Miller time × switching frequency"));
   }else if(isFinite(Vg)&&isFinite(Vplateau)&&aVg<=Vplateau){
     out.push(R("Gate-drive warning",null,"","gate drive must be higher than the Miller plateau voltage"));
   }
   const tot = pc*kh + ps;
   out.push(R("Total in the FET",tot,"W","hot conduction plus switching"));
   if(isFinite(Rja)&&isFinite(Ta)){
     const tj = Ta + tot*Rja;
      /* The caveat belongs beside the number rather than in a paragraph at
         the top of the page. A datasheet θJA is that package on that
         maker's own test board in still air; bolt a heatsink on and the
         path is a different one entirely.                               */
      out.push(R("Junction temperature",tj,"°C",
        (tj>150?"over a typical 150 °C limit":tj>125?"close to the limit":"within a typical limit")+
        " – on the "+siFmt(Rja,"°C/W")+" entered above. For a device brought in from the list that is the package on the datasheet's own test board, in still air, with nothing bolted to it. Put a heatsink on and the figure to enter is θJC + θCS + θSA, never θJA."));
      /* (125 - Ta) / P is arithmetic, not advice. At a few milliwatts it
         asks for thousands of degrees per watt, which no package has and
         none needs: what it means is that the thermal path has stopped
         mattering, and saying so is more use than the number.          */
      const need = (125-Ta)/tot;
      if(!(tot>0) || !isFinite(need)){
        out.push(R("Thermal path",null,"","no dissipation to get rid of"));
      }else if(Ta>=125){
        out.push(R("Thermal path",null,"","the ambient is already at or above 125 °C, so no thermal path reaches it"));
      }else if(need>500){
        out.push(R("Thermal path",null,"","the losses are low enough that the bare package in still air stays far inside 125 °C – nothing to solve here"));
      }else{
        out.push(R("θ needed for 125 °C",need,"°C/W","total junction to ambient"+
          (isFinite(Rja) ? (Rja<=need ? "; the "+siFmt(Rja,"°C/W")+" entered above is inside it" : "; the "+siFmt(Rja,"°C/W")+" entered above is not enough") : "")));
      }
   }
   return out;
 }},

{id:"sync", group:"Power", name:"Synchronous buck / boost losses",
 note:[
  "Uses the ideal duty cycle to split the inductor RMS current between the two MOSFETs, then adds conduction, gate-drive, hard-switching and body-diode dead-time losses.",
  "The switching-loss estimate is assigned to the hard-switched device: high side in a buck, low side in a boost. It is a first-pass overlap estimate; ringing, COSS, reverse recovery and gate timing still need measured waveforms.",
  "Enter hot RDS(on) values, or include their temperature multiplier yourself. The junction estimates use the entered thermal paths independently for both MOSFETs and the inductor."
 ],
 fields:[FS("topo","Topology",["Synchronous buck","Synchronous boost"],"Synchronous buck"),
         F("Vin","Input voltage","V","24"),F("Vout","Output voltage","V","5"),F("Iout","Output current","A","5"),
         F("fs","Switching frequency","Hz","500k"),F("L","Inductor","H","10u"),F("DCR","Inductor DCR","Ω","20m"),
         F("Rhs","High-side MOSFET RDS(on)","Ω","10m"),F("Rls","Low-side MOSFET RDS(on)","Ω","10m"),
         F("tr","Hard-switch rise time","s","20n"),F("tf","Hard-switch fall time","s","20n"),
         F("QgH","High-side total gate charge","C","20n"),F("QgL","Low-side total gate charge","C","20n"),F("Vdrv","Gate-drive voltage","V","10"),
         F("tdead","Dead time per edge","s","30n"),F("Vfbody","Body-diode forward drop","V","0.9"),
         F("RthH","High-side thermal path θJA","°C/W","35"),F("RthL","Low-side thermal path θJA","°C/W","35"),
         F("RthInd","Inductor thermal resistance","°C/W","25"),F("Ta","Ambient","°C","40")],
 tbl:"packages",
 run(v){
   const {topo,Vin,Vout,Iout,fs,L,DCR,Rhs,Rls,tr,tf,QgH,QgL,Vdrv,tdead,Vfbody,RthH,RthL,RthInd,Ta}=v;
   const boost=topo==="Synchronous boost";
   if(![Vin,Vout,Iout,fs,L,DCR,Rhs,Rls,tr,tf,QgH,QgL,Vdrv,tdead,Vfbody,RthH,RthL,RthInd,Ta].every(isFinite) ||
      Vin<=0||Vout<=0||Iout<=0||fs<=0||L<=0||DCR<0||Rhs<0||Rls<0||tr<0||tf<0||QgH<0||QgL<0||Vdrv<0||tdead<0||Vfbody<0||RthH<0||RthL<0||RthInd<0) return null;
   const duty=boost ? 1-Vin/Vout : Vout/Vin;
   if(!(duty>0&&duty<1)) return [R("Topology check",null,"",boost?"A boost needs Vout higher than Vin.":"A buck needs Vout lower than Vin.")];
   const iL=boost ? Vout*Iout/Vin : Iout;
   const dIL=boost ? Vin*duty/(L*fs) : (Vin-Vout)*duty/(L*fs);
   const iVal=iL-dIL/2, iRms=Math.sqrt(iL*iL+dIL*dIL/12);
   const iH=iRms*Math.sqrt(boost ? 1-duty : duty), iLfet=iRms*Math.sqrt(boost ? duty : 1-duty);
   const pCondH=iH*iH*Rhs, pCondL=iLfet*iLfet*Rls, pInd=iRms*iRms*DCR;
   const pGateH=QgH*Vdrv*fs, pGateL=QgL*Vdrv*fs;
   const pSw=.5*(boost?Vout:Vin)*iL*(tr+tf)*fs;
   const pBody=2*Vfbody*iL*tdead*fs;
   /* What heats the die and what the converter pays are two different
      numbers. The gate charge is spent in the driver and the gate loop,
      so it counts against efficiency but must not be pushed through the
      MOSFET's thermal path.                                            */
   const pDieH=pCondH+(boost?pBody: pSw);
   const pDieL=pCondL+(boost?pSw: pBody);
   const pHigh=pDieH+pGateH;
   const pLow=pDieL+pGateL;
   const pTotal=pHigh+pLow+pInd, pOut=Vout*Iout, eta=pOut/(pOut+pTotal);
   const tHigh=Ta+pDieH*RthH, tLow=Ta+pDieL*RthL, tInd=Ta+pInd*RthInd;
   const hard=boost?"low-side MOSFET":"high-side MOSFET", body=boost?"high-side MOSFET":"low-side MOSFET";
   const out=[R("Duty cycle",duty,"×",boost?"1 − Vin / Vout":"Vout / Vin"),
              R("Output power",pOut,"W","Vout × Iout"),
              R("Inductor average current",iL,"A", boost ? "Vout × Iout ÷ Vin — a boost's inductor carries the input current" : "the load current — a buck's inductor sits in series with the output"),
              R("Inductor ripple ΔIL",dIL,"A", boost ? "Vin × D ÷ (L × f)" : "(Vin − Vout) × D ÷ (L × f)"),
              R("Inductor RMS current",iRms,"A","√(Iavg² + ΔIL² ÷ 12) — the triangular ripple adds in quadrature with the DC"),
              R("High-side MOSFET RMS current",iH,"A", "inductor IRMS × √"+(boost?"(1 − D)":"D")+" — it conducts only for that fraction of the cycle"),
              R("Low-side MOSFET RMS current",iLfet,"A", "inductor IRMS × √"+(boost?"D":"(1 − D)")),
              R("High-side conduction loss",pCondH,"W","IRMS² × RDS(on)"),R("Low-side conduction loss",pCondL,"W","IRMS² × RDS(on)"),
              R("Hard-switching loss",pSw,"W","½ × "+(boost?"Vout":"Vin")+" × IL × (tr + tf) × f, assigned to the "+hard),
              R("Body-diode dead-time loss",pBody,"W","assigned to the "+body+"; 2 × VF × IL × dead time × f"),
              R("High-side gate-drive loss",pGateH,"W","Qg × Vdrive × f — drawn from the gate-driver supply, not dissipated in the FET"),
              R("Low-side gate-drive loss",pGateL,"W","Qg × Vdrive × f — drawn from the gate-driver supply, not dissipated in the FET"),
              R("Inductor copper loss",pInd,"W","inductor IRMS² × DCR"),
              R("High-side total loss",pHigh,"W","conduction + "+(boost?"body diode":"hard switching")+" + gate drive \u2014 what the converter pays; only the first two heat the die"),
              R("Low-side total loss",pLow,"W","conduction + "+(boost?"hard switching":"body diode")+" + gate drive \u2014 what the converter pays; only the first two heat the die"),
              R("Total conversion loss",pTotal,"W","both MOSFETs plus the inductor's copper"),
              R("Power-stage efficiency",100*eta,"%","Pout ÷ (Pout + total loss) × 100 — does not include controller quiescent or capacitor loss"),
              R("High-side junction estimate",tHigh,"°C","ambient + (conduction + "+(boost?"body diode":"hard switching")+") × its entered thermal path \u2014 the gate-drive loss is left out, because the driver dissipates it"),
              R("Low-side junction estimate",tLow,"°C","ambient + (conduction + "+(boost?"hard switching":"body diode")+") × its entered thermal path \u2014 the gate-drive loss is left out, because the driver dissipates it"),
              R("Inductor temperature estimate",tInd,"°C","ambient + copper loss × its entered thermal path")];
   if(iVal<=0) out.push(R("Conduction-mode warning",null,"","inductor current reaches zero; the CCM loss split and ripple estimates no longer apply."));
   if(Math.max(tHigh,tLow,tInd)>125) out.push(R("Thermal warning",null,"","at least one entered thermal path puts its part above 125 °C; improve cooling or reduce loss."));
   return out;
 }},

{id:"protection", group:"Power", name:"Fuse / PTC / inrush sizing",
 note:[
  "A fuse, resettable PTC and NTC limiter answer different questions. This calculator keeps them separate so a current rating is not mistaken for a fault, pulse or inrush rating.",

 fields:[FS("kind","Protection to size",["Fuse","PTC resettable fuse","Capacitor inrush limiter"],"Fuse"),
         F("Irun","Continuous load current","A","2"),
         {...F("derate","Fuse continuous-use fraction","%","75"),showWhen:{k:"kind",is:"Fuse"}},
         {...F("Istart","Startup pulse current","A","8"),showWhen:{k:"kind",is:"Fuse"}},
         {...F("tstart","Startup pulse duration","s","20m"),showWhen:{k:"kind",is:"Fuse"}},
         {...F("I2tfuse","Fuse pre-arcing I²t (optional)","A²s","2"),showWhen:{k:"kind",is:"Fuse"}},
         {...F("Ihold25","PTC hold current at 25 °C","A","2.5"),showWhen:{k:"kind",is:"PTC resettable fuse"}},
         {...F("Itrip25","PTC trip current at 25 °C","A","5"),showWhen:{k:"kind",is:"PTC resettable fuse"}},
         {...F("Ta","PTC ambient temperature","°C","50"),showWhen:{k:"kind",is:"PTC resettable fuse"}},
         {...F("holdDerate","PTC hold-current derating","%/°C","0.7"),showWhen:{k:"kind",is:"PTC resettable fuse"}},
         {...F("Rhot","PTC hot resistance","Ω","0.2"),showWhen:{k:"kind",is:"PTC resettable fuse"}},
         {...F("Vin","Charging voltage","V","325"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}},
         {...F("Cbulk","Bulk capacitance","F","220u"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}},
         {...F("Rline","Line / bridge / capacitor ESR","Ω","2"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}},
         {...F("IpkMax","Target maximum inrush current","A","10"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}},
         {...F("RlimCold","Selected limiter cold resistance","Ω","33"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}},
         {...F("RlimHot","Limiter hot resistance","Ω","1"),showWhen:{k:"kind",is:"Capacitor inrush limiter"}}],
 run(v){
   const {kind,Irun}=v;
   if(!isFinite(Irun)||Irun<0) return null;
   if(kind==="Fuse"){
     const {derate,Istart,tstart,I2tfuse}=v;
     if(![derate,Istart,tstart].every(isFinite)||derate<=0||derate>100||Istart<0||tstart<0) return null;
     const i2t=Istart*Istart*tstart, rating=Irun/(derate/100);
     const out=[R("Minimum continuous fuse rating",rating,"A","load current ÷ allowed continuous-use fraction"),
                R("Startup-pulse I²t",i2t,"A²s","Istart² × pulse duration"),
                R("Recommended next rating",rating*1.25,"A","choose the next available rating only after checking its time-current curve")];
     if(isFinite(I2tfuse)&&I2tfuse>0) out.push(R("Pre-arcing I²t margin",I2tfuse/i2t,"×",I2tfuse<i2t?"the entered fuse I²t is below the startup pulse":"do not rely on this alone; use the full curve"));
     return out;
   }
   if(kind==="PTC resettable fuse"){
     const {Ihold25,Itrip25,Ta,holdDerate,Rhot}=v;
     if(![Ihold25,Itrip25,Ta,holdDerate,Rhot].every(isFinite)||Ihold25<=0||Itrip25<=0||Rhot<0) return null;
     const factor=Math.max(0,1-(Ta-25)*holdDerate/100), hold=Ihold25*factor, trip=Itrip25*factor, p=Irun*Irun*Rhot;
     const out=[R("Estimated hold current at ambient",hold,"A","linear first pass from the entered coefficient; the datasheet curve governs"),
                R("Estimated trip current at ambient",trip,"A","the same linear first pass, on the entered trip current"),R("Continuous-current use",100*Irun/hold,"%","Irun ÷ the estimated hold current × 100 — "+(Irun>hold?"above the estimated hold current":"leave margin for enclosure temperature and tolerance")),
                R("PTC hot dissipation",p,"W","Irun² × hot resistance")];
     if(Irun>=trip) out.push(R("PTC state warning",null,"","the entered current is at or above the estimated trip current."));
     return out;
   }
   const {Vin,Cbulk,Rline,IpkMax,RlimCold,RlimHot}=v;
   if(![Vin,Cbulk,Rline,IpkMax,RlimCold,RlimHot].every(isFinite)||Vin<=0||Cbulk<=0||Rline<0||IpkMax<=0||RlimCold<0||RlimHot<0) return null;
   const rTotal=Rline+RlimCold, peak=Vin/rTotal, tau=rTotal*Cbulk, energy=.5*Cbulk*Vin*Vin, need=Math.max(0,Vin/IpkMax-Rline);
   const out=[R("Minimum cold limiter resistance",need,"Ω","Vin \u00f7 the target peak current \u2212 the entered line resistance, to hold inrush at or below the target"),R("Selected peak inrush current",peak,"A","Vin ÷ (line resistance + cold limiter resistance)"),
              R("Bulk-capacitor charge energy",energy,"J","½ × C × V²"),R("Initial RC charge time constant",tau,"s","(line resistance + cold limiter resistance) × Cbulk"),
              R("Approximate 99 % charge time",5*tau,"s","five time constants, before the NTC resistance changes"),
              R("Initial limiter dissipation",peak*peak*RlimCold,"W","instantaneous cold-resistance loss"),
              R("Hot limiter continuous loss",Irun*Irun*RlimHot,"W","after an NTC has warmed up")];
   if(peak>IpkMax) out.push(R("Inrush warning",null,"","the selected cold resistance does not meet the entered peak-current target."));
   return out;
 }},

{id:"diode", group:"Components", name:"Diode selection & losses",
 note:[
  "Combines forward conduction, optional dynamic resistance and hard-switch reverse-recovery loss. A Schottky normally has negligible QRR, but its reverse leakage rises sharply with temperature.",
  "Use voltage and current ratings with margin. Junction temperature is a steady-state estimate from the entered thermal path; pulse surge and repetitive avalanche limits still belong to the diode datasheet."
 ],
 fields:[FS("type","Diode technology",["Schottky","Ultrafast PN","Standard PN"],"Schottky"),
         F("Iavg","Average forward current","A","2"),F("Irms","Forward RMS current","A","2.2"),
         F("Vf","Forward drop at operating current","V","0.55"),F("Rd","Additional dynamic resistance (optional)","Ω","0"),
         F("Vrev","Maximum repetitive reverse voltage","V","40"),F("Vrrm","Diode VRRM rating","V","60"),
         F("fs","Hard-switching frequency","Hz","250k"),F("Qrr","Reverse-recovery charge QRR (optional)","C",""),
         F("Rth","Junction-to-ambient thermal path","°C/W","35"),F("Ta","Ambient","°C","40"),F("Tjmax","Junction-temperature limit","°C","150")],
 run(v){
   const {type,Iavg,Irms,Vf,Rd,Vrev,Vrrm,fs,Qrr,Rth,Ta,Tjmax}=v;
   if(![Iavg,Irms,Vf,Rd,Vrev,Vrrm,fs,Rth,Ta,Tjmax].every(isFinite)||Iavg<0||Irms<0||Vf<0||Rd<0||Vrev<0||Vrrm<=0||fs<0||Rth<0) return null;
   const pFwd=Iavg*Vf+Irms*Irms*Rd, pRR=isFinite(Qrr)&&Qrr>0 ? Qrr*Vrev*fs : 0, p=pFwd+pRR, tj=Ta+p*Rth;
   const out=[R("Forward-conduction loss",pFwd,"W","IAVG × VF + IRMS² × additional dynamic resistance"),
              R("Reverse-recovery loss",pRR,"W",isFinite(Qrr)&&Qrr>0?"QRR × reverse voltage × switching frequency":"QRR was left blank; not included"),
              R("Total diode loss",p,"W","forward conduction + reverse recovery"),R("Junction temperature estimate",tj,"°C","ambient + total loss × the entered thermal path"),
              R("Junction-temperature margin",Tjmax-tj,"°C","the entered Tj(max) − the estimate above"),R("Required VRRM with 25 % margin",1.25*Vrev,"V","repetitive reverse voltage × 1.25"),
              R("Voltage-rating use",100*Vrev/Vrrm,"% of VRRM","reverse voltage ÷ the entered VRRM × 100"),R("Suggested average-current rating",1.25*Iavg,"A","starting margin; derate for case temperature and waveform")];
   if(Vrev>Vrrm) out.push(R("Reverse-voltage warning",null,"","the entered repetitive reverse voltage exceeds the diode's VRRM rating."));
   if(tj>Tjmax) out.push(R("Thermal warning",null,"","the entered thermal path puts the diode above its junction-temperature limit."));
   if(type==="Schottky"&&isFinite(Qrr)&&Qrr>0) out.push(R("Technology note",null,"","a Schottky should not have a PN reverse-recovery charge; check whether the entered part is actually a silicon-carbide or PN diode."));
   return out;
 }},

{id:"heatsink", group:"Power", name:"Heatsink & thermal stack",
 note:[
   "A heatsink is only the final resistance in the path: junction to case, interface, heatsink, then air. Enter the device loss at the actual duty cycle and junction temperature.",
   "θJA is useful only as a bare-device comparison from the manufacturer's stated test board. Once a heatsink is fitted, use θJC + θCS + θSA instead.",
   "These are steady-state values. Short pulses need the part's transient thermal-impedance curve, and a fan needs the heatsink's forced-air θSA rating."
 ],
 fields:[F("Pd","Device dissipation","W","4.35"),F("Tj","Allowed junction temperature","°C","125"),
         F("Ta","Ambient","°C","40"),F("Rjc","θJC junction to case","°C/W","3"),
         F("Rcs","θCS interface pad / grease","°C/W","0.5"),
         F("Rsa","θSA of selected heatsink (optional)","°C/W",""),
         F("Rja","Bare-device θJA for comparison (optional)","°C/W","")],
 tbl:"packages",
 run(v){
   const {Pd,Tj,Ta,Rjc,Rcs,Rsa,Rja} = v;
   if(!isFinite(Pd)||!isFinite(Tj)||!isFinite(Ta)||Pd<=0) return null;
   if(Tj<=Ta) return [R("Thermal target",null,"","the allowed junction temperature must be higher than ambient")];
   const rjc=isFinite(Rjc)&&Rjc>=0?Rjc:0, rcs=isFinite(Rcs)&&Rcs>=0?Rcs:0;
   const budget=(Tj-Ta)/Pd, fixed=rjc+rcs, need=budget-fixed;
   const out=[R("Total junction-to-ambient budget",budget,"\u00b0C/W","(junction limit \u2212 ambient) \u00f7 device dissipation"),
              R("Fixed path \u03b8JC + \u03b8CS",fixed,"\u00b0C/W","inside the package and its interface"),
              R("Heatsink must be under",need,"\u00b0C/W",
                need<=0?"no heatsink can meet this target \u2014 reduce loss or improve the package/interface":
                need<1?"typically needs a large sink with forced air":need<5?"typically needs a substantial extruded sink":"often possible with a small clip-on or board-mounted sink")];
   if(isFinite(Rsa)&&Rsa>=0){
     const total=fixed+Rsa, tsink=Ta+Pd*Rsa, tcase=tsink+Pd*rcs, tj=tcase+Pd*rjc;
     out.push(R("Total \u03b8JA with selected sink",total,"\u00b0C/W","\u03b8JC + \u03b8CS + \u03b8SA"),
              R("Heatsink temperature",tsink,"\u00b0C","estimate at the sink base in the entered ambient"),
              R("Case temperature",tcase,"\u00b0C","estimate after the thermal interface"),
              R("Junction with selected sink",tj,"\u00b0C",tj>Tj?"over the entered limit":"within the entered limit"),
              R("Junction margin",Tj-tj,"\u00b0C","the entered junction limit \u2212 the estimate above"),
              R("Maximum dissipation with this sink",(Tj-Ta)/total,"W","steady state at the entered ambient"));
   }else if(need>0){
     const tsink=Ta+Pd*need, tcase=tsink+Pd*rcs;
     out.push(R("Target sink-base temperature",tsink,"\u00b0C","if the sink is chosen exactly at the required \u03b8SA"),
              R("Target case temperature",tcase,"\u00b0C","before the \u03b8JC temperature rise"));
   }
   if(isFinite(Rja)&&Rja>=0){
     const bare=Ta+Pd*Rja;
     out.push(R("Bare-device junction with \u03b8JA",bare,"\u00b0C",bare>Tj?"above the entered limit":"comparison only; \u03b8JA depends on the maker's test board"));
   }
   return out;
 }}
];

DIAGRAMS.hyst = (r,o) => {
  const inv  = (r.topo||"Non-inverting") === "Inverting";
  /* the two inputs swap between the topologies, nothing else moves */
  const sigY = inv ? 95 : 125, refY = inv ? 125 : 95;
  const OX = 190, OY = 110;

  let g = OPAMP(OX,OY) + W([[OX+52,OY],[330,OY]]) + DOT(310,OY) + NODE(372,OY+4,"out","end");

  /* the node that carries R1 and the feedback */
  g += RESH(90,125,"R1",vv(r,"R1","")) + W([[16,125],[71,125]]) + W([[109,125],[OX,125]]) + DOT(150,125);
  g += W([[150,125],[150,170]]) + W([[150,170],[221,170]])
     + RESH(240,170,"R2",vv(r,"R2","")) + W([[259,170],[310,170]]) + W([[310,170],[310,OY]]);
  /* the other input goes straight in */
  g += W([[16,95],[OX,95]]);

  g += NODE(14,sigY-9,"Vin","start") + NODE(14,refY-9,"Vref","start")
     + VAL(60,refY-9, refY===95 ? vv(r,"Vref","") : "", "middle");

  /* Transfer loop: input across, output up. Every label has to fit inside the
     viewBox - a text baseline below it is simply clipped away.              */
  const bx=34, bw=146, by=282, bh=86;
  const yTop = by-bh, yBot = by, axisY = by+6;
  const VTHs = got(o,"Upper trip point"), VTLs = got(o,"Lower trip point");
  const th = parseSI(VTHs), tl = parseSI(VTLs);
  let xh = bx+bw*0.68, xl = bx+bw*0.32;
  if(isFinite(th) && isFinite(tl) && th !== tl){
    /* 0.9 of the span as margin puts the two steps 36 % apart, which is wide
       enough that their labels cannot touch                                 */
    const span = Math.abs(th-tl), pad = span*0.9;
    const lo = Math.min(th,tl)-pad, hi = Math.max(th,tl)+pad;
    const map = t => bx + bw*(t-lo)/(hi-lo);
    xh = map(Math.max(th,tl)); xl = map(Math.min(th,tl));
  }
  /* the axis label sits above the arrow head, not across the Vin axis that
     starts six pixels to its right */
  g += W([[bx,axisY],[bx+bw+14,axisY]]) + W([[bx-6,axisY],[bx-6,206]])
     + TX(bx-6,192,"Vout","middle","var(--ink3)",10)
     + TX(bx+bw+18,axisY+12,"Vin","start","var(--ink3)",10);

  /* which level belongs to which side depends on the topology */
  const hiFirst = !inv;
  const yA = hiFirst ? yTop : yBot, yB = hiFirst ? yBot : yTop;
  g += W([[bx,yB],[xh,yB]]) + W([[xh,yB],[xh,yA]]) + W([[xh,yA],[bx+bw,yA]]);
  g += W([[bx+bw,yA],[xl,yA]]) + W([[xl,yA],[xl,yB]]) + W([[bx,yB],[xl,yB]]);
  g += ARROW(xl-26,yB,xl-8,yB,"") + ARROW(xh+26,yA,xh+8,yA,"");
  g += TX(xl,axisY+16,VTLs||"VTL","middle","var(--kapton)",10.5)
     + TX(xh,axisY+16,VTHs||"VTH","middle","var(--kapton)",10.5);

  /* the window, the centre and the reason for R2 are all in the table just
     above the drawing - only the figures that mark a place on the axis are
     really part of it                                                       */
  g += TX(214,248,inv ? "rising input \u2192 output low"
                      : "rising input \u2192 output high","start","var(--ink3)",11);
  return SVG(g, 400, 316);
};

const AMP_CALCS = [

{id:"hyst", group:"Op-amps", name:"Comparator with hysteresis",
 note:[
  "A Schmitt trigger. R2 feeds a little of the output back to the non-inverting input, so the trip point moves away from the input the moment it flips \u2014 which is what stops a slow or noisy signal from chattering.",
  "R1 carries the signal in the non-inverting form, and the reference in the inverting one.",
  "Leave R1 empty and state the window you want instead, and it will be sized for you."
 ],
 fields:[FS("topo","Topology",["Non-inverting","Inverting"],"Non-inverting"),
         F("Vref","Reference at the other input","V","2.5"),
         F("VoH","Output high","V","5"),F("VoL","Output low","V","0"),
         F("R1","R1 at the node","\u03a9","10k"),
         F("R2","R2 from the output","\u03a9","100k"),
         F("Hw","Or the window you want","V","")],
 run(v){
   const {topo,Vref,VoH,VoL,R1,R2,Hw} = v;
   const inv = topo === "Inverting";
   if(!isFinite(Vref)||!isFinite(VoH)||!isFinite(VoL)) return null;
   if(VoH <= VoL) return [R("Output",null,"","the high level has to sit above the low level")];
   const swing = VoH - VoL;

   /* sizing: R1 from a wanted window */
   if(isFinite(Hw) && Hw>0 && isFinite(R2) && !isFinite(R1)){
     if(Hw >= swing) return [R("R1",null,"","the window cannot reach the output swing of "+siFmt(swing,"V"))];
     const need = inv ? R2*Hw/(swing-Hw) : R2*Hw/swing;
     const e = nearestE24(need);
     const got = inv ? swing*e/(e+R2) : swing*e/R2;
     return [RP("R1 needed",need,"\u03a9", inv ? "R2 \u00d7 window \u00f7 (swing \u2212 window)" : "R2 \u00d7 window \u00f7 swing"),
             RP("Nearest E24",e,"\u03a9"),
             R("Window with E24",got,"V", inv ? "swing \u00d7 R1 \u00f7 (R1 + R2)" : "swing \u00d7 R1 \u00f7 R2"),
             R("Ratio R1 : R2",need/R2,"\u00d7","R1 \u00f7 R2")];
   }
   if(!isFinite(R1)||!isFinite(R2)||R1<=0||R2<=0) return null;

   /* thresholds */
   let VTH, VTL, hyst;
   if(inv){
     /* the node is a divider between Vref through R1 and the output through R2 */
     VTH = (Vref*R2 + VoH*R1)/(R1+R2);
     VTL = (Vref*R2 + VoL*R1)/(R1+R2);
     hyst = swing*R1/(R1+R2);
   } else {
     /* the signal reaches the node through R1, the output through R2 */
     VTH = Vref + (Vref-VoL)*R1/R2;
     VTL = Vref + (Vref-VoH)*R1/R2;
     hyst = swing*R1/R2;
   }
   const out = [R("Upper trip point",VTH,"V", (inv ? "(Vref \u00d7 R2 + VoH \u00d7 R1) \u00f7 (R1 + R2) \u2014 crossed on the way up, output goes low"
                                                : "Vref + (Vref \u2212 VoL) \u00d7 R1 \u00f7 R2 \u2014 crossed on the way up, output goes high")),
                R("Lower trip point",VTL,"V", (inv ? "(Vref \u00d7 R2 + VoL \u00d7 R1) \u00f7 (R1 + R2) \u2014 crossed on the way down, output goes high"
                                                : "Vref + (Vref \u2212 VoH) \u00d7 R1 \u00f7 R2 \u2014 crossed on the way down, output goes low")),
                R("Window",hyst,"V", (inv ? "swing \u00d7 R1 \u00f7 (R1 + R2)" : "swing \u00d7 R1 \u00f7 R2")+" \u2014 how far the signal must come back before it flips again"),
                R("Centre of the window",(VTH+VTL)/2,"V","(upper + lower) \u00f7 2"),
                R("Feedback fraction",inv ? R1/(R1+R2) : R1/R2,"\u00d7", (inv ? "R1 \u00f7 (R1 + R2)" : "R1 \u00f7 R2")+" of the output swing")];

   /* a threshold outside the output range can never be reached */
   const lo = Math.min(VoL,VoH), hi = Math.max(VoL,VoH);
   if(VTH > hi || VTL < lo)
     out.push(R("Warning",null,"","a trip point sits outside "+siFmt(lo,"V")+" to "+siFmt(hi,"V")+" \u2014 the output would latch and never come back"));
   if(hyst < 0.02)
     out.push(R("Warning",null,"","a window under 20 mV is thinner than the noise on most boards"));
   out.push(R("Current in the feedback leg at the flip",swing/(R1+R2),"A","swing \u00f7 (R1 + R2) \u2014 keep it well inside what the output can source"));
   return out;
 }},

{id:"opnoise", group:"Op-amps", name:"Op-amp noise & SNR",
 note:[
  "Combines white voltage noise, input-current noise and the Johnson noise of the gain-setting resistors over the entered closed-loop noise bandwidth.",
  "It is a first-pass white-noise calculation: 1/f noise, bias-current offsets, EMI, reference noise, anti-alias filtering and source noise outside the resistor are separate design checks.",
  "If an ADC is supplied, its ideal quantisation noise is combined in RMS. The resulting ENOB is signal-specific, not the converter's datasheet ENOB."
 ],
 fields:[FS("topo","Amplifier topology",["Non-inverting","Inverting"],"Non-inverting"),
         F("Rs","Source resistance","Ω","1k"),{...F("Rg","Gain resistor Rg to ground","Ω","1k"),showWhen:{k:"topo",is:"Non-inverting"}},
         {...F("Rin","Input resistor Rin","Ω","10k"),showWhen:{k:"topo",is:"Inverting"}},F("Rf","Feedback resistor Rf","Ω","10k"),
         F("en","Op-amp voltage-noise density","V/√Hz","10n"),F("in","Op-amp current-noise density","A/√Hz","1p"),
         F("B","Closed-loop noise bandwidth","Hz","20k"),F("T","Resistor temperature","°C","25"),F("Vsig","Input sine signal (RMS)","V","0.1"),
         F("Vref","ADC full-scale / reference (optional)","V","3.3"),F("bits","ADC bits (optional)","","12")],
 run(v){
   const {topo,Rs,Rg,Rin,Rf,en,in:inNoise,B,T,Vsig,Vref,bits}=v;
   const inv=topo==="Inverting", gainR=inv?Rin:Rg;
   if(![Rs,gainR,Rf,en,inNoise,B,T,Vsig].every(isFinite)||Rs<0||gainR<=0||Rf<=0||en<0||inNoise<0||B<=0||Vsig<0) return null;
   const kelvin=T+273.15;
   if(kelvin<=0) return [R("Temperature",null,"","enter a temperature above absolute zero.")];
   const k=1.380649e-23, thermal=r=>Math.sqrt(4*k*kelvin*r);
   const signalGain=inv?Rf/Rin:1+Rf/Rg, noiseGain=1+Rf/gainR;
   const nSource=thermal(Rs)*(inv?signalGain:noiseGain);
   const nGain=thermal(gainR)*(inv?signalGain:Rf/Rg);
   const nFeedback=thermal(Rf), nAmp=en*noiseGain, nCurrent=inNoise*(inv?Rf:Rs*noiseGain);
   const density=Math.hypot(nSource,nGain,nFeedback,nAmp,nCurrent), ampRms=density*Math.sqrt(B);
   const signalOut=Vsig*signalGain;
   const out=[R("Closed-loop signal gain",signalGain,"×",inv?"magnitude; the output is inverted":"non-inverting gain"),
              R("Noise gain",noiseGain,"×","sets op-amp voltage-noise gain"),
              R("Source-resistor output noise density",nSource,"V/√Hz","√(4kTRs), carried to the output by the "+(inv?"signal gain":"noise gain")),
              R("Gain-resistor output noise density",nGain,"V/√Hz","√(4kTR) on "+(inv?"Rin":"Rg")+", carried to the output"),
              R("Feedback-resistor output noise density",nFeedback,"V/√Hz","√(4kTRf) — Rf's own thermal noise arrives at the output directly"),
              R("Op-amp voltage-noise density at output",nAmp,"V/√Hz","en × noise gain — en is amplified by the noise gain, not the signal gain"),
              R("Op-amp current-noise density at output",nCurrent,"V/√Hz","in × "+(inv?"Rf":"Rs, then the noise gain")+" — the current noise turned into a voltage"),
              R("Total output-noise density",density,"V/√Hz","the five above added in quadrature: they are uncorrelated"),
              R("Amplifier output noise (RMS)",ampRms,"V","white-noise density × √bandwidth"),
              R("Input-referred amplifier noise (RMS)",ampRms/signalGain,"V","output noise ÷ signal gain — what it would look like at the input"),
              R("Output signal (RMS)",signalOut,"V","input × signal gain"),
              R("Amplifier-only SNR",signalOut>0?20*Math.log10(signalOut/ampRms):NaN,"dB","20 log₁₀(signal ÷ amplifier noise)")];
   if(isFinite(Vref)&&Vref>0&&isFinite(bits)&&bits>0&&bits<=32){
     const lsb=Vref/Math.pow(2,Math.round(bits)), q=lsb/Math.sqrt(12), total=Math.hypot(ampRms,q), snr=signalOut>0?20*Math.log10(signalOut/total):NaN;
     out.push(R("ADC LSB",lsb,"V","Vref ÷ 2^bits"),
              R("ADC quantisation noise (RMS)",q,"V","ideal LSB ÷ √12"),
              R("Total noise at ADC (RMS)",total,"V","√(amplifier noise² + quantisation²)"),
              R("System SNR including ADC",snr,"dB","20 log₁₀(signal ÷ total noise)"),
              R("Signal-specific effective bits",(snr-1.76)/6.02,"bits","from sine-wave SNR; not the ADC datasheet ENOB"));
     if(signalOut*Math.SQRT2>Vref) out.push(R("ADC headroom warning",null,"","the entered sine-wave peak exceeds the ADC full-scale reference."));
   }
   return out;
 }}
];

{id:"adc", group:"Measurement", name:"ADC input front-end",
 note:[
  "Sizes a safe divider for a signal above the ADC reference, then checks the filtering, the settling and a first-pass error budget.",
  "That budget combines the stated static errors with 3\u03c3 random noise, so it is a shape to design to rather than a number to quote."
 ],
 fields:[F("Vsig","Maximum signal","V","12"),F("Vref","ADC reference / full scale","V","3.3"),
         F("bits","ADC resolution","bit","12"),F("Rbot","Chosen lower divider resistor","Ω","10k"),
         F("Rsrc","Source + series resistance","Ω","1k"),F("C","ADC filter capacitor","F","10n"),
         F("fs","Sample rate","Hz","10k"),F("Vfault","Possible fault voltage","V","24"),
         F("Iclamp","Allowed clamp current","A","1m"),
         F("VrefErr","Reference initial error","%","0.1","0.1",true),F("VrefTC","Reference temperature coefficient","ppm/°C","10","10"),
         F("Tspan","Temperature excursion","°C","30","30"),F("divErr","Divider ratio error","%","0.1","0.1"),
         F("offset","ADC offset error","LSB","0.5","0.5"),F("inl","ADC INL error","LSB","1","1"),
         F("noise","Input-referred noise (RMS)","V","100u","100u")],
 run(v){
   const {Vsig,Vref,bits,Rbot,Rsrc,C,fs,Vfault,Iclamp,VrefErr,VrefTC,Tspan,divErr,offset,inl,noise} = v;
   if(!isFinite(Vsig)||!isFinite(Vref)||!isFinite(Rbot)||!isFinite(Rsrc)||!isFinite(C)||
      !isFinite(VrefErr)||!isFinite(VrefTC)||!isFinite(Tspan)||!isFinite(divErr)||!isFinite(offset)||!isFinite(inl)||!isFinite(noise)||

   const rNeed = Math.max(0,Rbot*(Vsig/Vref-1));
   const rTop = rNeed>0 ? e24AtLeast(rNeed) : 0;
   const vAdc = rTop>0 ? Vsig*Rbot/(rTop+Rbot) : Vsig;
   const rth = rTop>0 ? rTop*Rbot/(rTop+Rbot) : 0;
   const rDrive = Rsrc+rth, fc=1/(2*Math.PI*rDrive*C);
   const n = Math.max(1,Math.round(bits||10));
   const tSettle = (n+1)*Math.LN2*rDrive*C;
   const out = [R("Rtop needed",rNeed,"Ω","Rbot × (Vsig ÷ Vref − 1)"),
                R("Safe E24 Rtop",rTop,"Ω","rounded up so the ADC pin stays at or below full scale"),
                R("Actual ADC maximum",vAdc,"V","Vsig × Rbot ÷ (Rtop + Rbot)"),
                R("ADC headroom",Vref-vAdc,"V","Vref − the actual maximum"),
                R("Divider Thevenin resistance",rth,"Ω","Rtop ∥ Rbot — what the ADC's sampling capacitor is charged through"),
                R("Filter cut-off",fc,"Hz","1 ÷ (2π × (Rsource + Rthevenin) × C)"),
                R("½ LSB settling time",tSettle,"s","(bits + 1) × ln2 × R × C — "+n+" bit accuracy after a full-scale step")];
   const lsb=Vref/Math.pow(2,n);
   const refError=Vref*(VrefErr/100+VrefTC*Tspan*1e-6);
   const dividerError=Vref*divErr/100, offsetError=offset*lsb, inlError=inl*lsb;
   const quantNoise=lsb/Math.sqrt(12), randomRSS=Math.hypot(quantNoise,noise);
   const conservative=refError+dividerError+offsetError+inlError+3*randomRSS;
   const accuracyBits=Math.max(0,n-Math.log2(Math.max(1,conservative/lsb)));
   out.push(R("ADC LSB size",lsb,"V","Vref ÷ 2^bits"),
            R("Quantisation noise (RMS)",quantNoise,"V","LSB ÷ √12 — the RMS of a uniform error one LSB wide"),
            R("Reference error",refError,"V","Vref × (initial error + drift × temperature span)"),
            R("Divider ratio error",dividerError,"V","Vref × the entered divider tolerance"),
            R("ADC offset error",offsetError,"V","offset in LSB × the LSB size"),
            R("ADC INL error",inlError,"V","INL in LSB × the LSB size"),
            R("Input-referred noise (RMS)",noise,"V"),
            R("RSS random uncertainty",randomRSS,"V","√(quantisation² + noise²) — random terms add in quadrature, not arithmetically"),
            R("Conservative total uncertainty",conservative,"V","static errors added, plus 3σ of the random ones"),
            R("Conservative error",100*conservative/Vref,"% of full scale","total uncertainty ÷ Vref × 100"),
            R("Resolution after error budget",accuracyBits,"bit","bits − log₂(total uncertainty ÷ LSB) — an accuracy estimate, not datasheet ENOB"));
   if(isFinite(fs)&&fs>0) out.push(R("Settling windows per sample",1/(fs*tSettle),"×",
     "the ADC acquisition window, not necessarily the whole sample period, must cover one settling time"));
   if(isFinite(Vfault)&&isFinite(Iclamp)&&Iclamp>0){
     const rProtect = Math.max(0,(Vfault-Vref)/Iclamp), extra=Math.max(0,rProtect-Rsrc);
     out.push(R("Total protection resistance",rProtect,"Ω","(Vfault − Vref) ÷ clamp current — to limit an external clamp to the stated current"),
              R("Extra protection resistance",extra,"Ω",extra>0?"in addition to the entered source resistance":"the entered series resistance is enough for that fault"));
   }
   return out;
 }},

      (isNTC&&(!isFinite(R25)||!isFinite(beta)||!isFinite(Vbias)||!isFinite(Rfixed)||R25<=0||beta<=0||Vbias<=0||Rfixed<=0))||
      (!isNTC&&(!isFinite(r0)||!isFinite(Rlead)||!isFinite(Iexc)||r0<=0||Rlead<0||Iexc<0))) return null;
   let temperature, sensorR;
   if(tempToR){
     temperature=T;
     sensorR=isNTC ? ntcResistance(temperature,R25,beta) : rtdResistance(temperature,r0);
   }else{
     sensorR=isNTC ? Rmeas : Rmeas-Rlead;
     if(sensorR<=0) return [R("Sensor resistance",null,"",isNTC?"measured NTC resistance must be positive":"measured total RTD resistance must exceed total lead resistance")];
     temperature=isNTC ? ntcTemperature(sensorR,R25,beta) : rtdTemperature(sensorR,r0);
   }
   if(!isFinite(sensorR)||!isFinite(temperature)||temperature<=-273.15)
     return [R("Temperature",null,"","resistance is outside the selected sensor model's usable range")];
   const sensitivity=isNTC ? ntcSensitivity(temperature,sensorR,beta) : rtdSensitivity(temperature,r0);
   const sensorCurrent=isNTC ? Vbias/(sensorR+Rfixed) : Iexc;
   const power=sensorCurrent*sensorCurrent*sensorR, selfHeat=power*1000/E;
   const out=[R("Sensor resistance",sensorR,"Ω", isNTC
                ? "R25 × exp(β × (1/T − 1/298.15)), T in kelvin — the Beta model"
                : "IEC 60751: R0 × (1 + A·t + B·t², and a third term below 0 °C)"),
              R(tempToR?"Sensor temperature (entered)":"Calculated sensor temperature",temperature,"°C", tempToR ? "" : (isNTC
                ? "the Beta model turned round: 1 ÷ (1/298.15 + ln(R/R25) ÷ β)"
                : "IEC 60751 solved for t \u2014 by formula above 0 °C, by search below it")),
              R("Resistance sensitivity",sensitivity,"Ω/°C", isNTC
                ? "−β × R ÷ T² — an NTC falls with temperature, and steeply"
                : "the derivative of the IEC curve at this temperature")];
   if(isNTC){
     const vout=Vbias*(ntcTop ? Rfixed : sensorR)/(sensorR+Rfixed);
     out.push(R("NTC divider output",vout,"V",ntcTop?"NTC is Rtop (to supply); fixed resistor is Rbot":"fixed resistor is Rtop; NTC is Rbot (to ground)"),
              R("NTC divider current",sensorCurrent,"A","supply ÷ (NTC + fixed resistor)"),
              R("NTC sensor voltage",ntcTop?Vbias-vout:vout,"V", ntcTop
                ? "supply − the divider output — with the NTC on top, the output is across the fixed resistor"
                : "the divider output itself — with the NTC at the bottom, the output is across it"));
   }else{
     const leadError=Rlead/Math.abs(sensitivity);
     out.push(R("Total resistance incl. leads",sensorR+Rlead,"Ω","sensor + the entered lead resistance"),
              R("Lead-induced temperature error",leadError,"°C","lead resistance ÷ sensitivity — a two-wire estimate; 3-wire or 4-wire connections cancel most of it"),
              R("Excitation voltage",Iexc*(sensorR+Rlead),"V","excitation current × total resistance"));
   }
   out.push(R("Sensor dissipation",power,"W","I² × sensor resistance"),
            R("Estimated self-heating rise",selfHeat,"°C","sensor power ÷ entered dissipation factor"));
   if(!tempToR) out.push(R("Estimated medium temperature",temperature-selfHeat,"°C","calculated sensor temperature minus estimated self-heating"));
   if(!isNTC) out.push(R("IEC RTD range check",temperature>=-200&&temperature<=850?"Within −200 to 850 °C":"Outside IEC 60751 range",""));
   if(selfHeat>0.1) out.push(R("Self-heating advice",null,"","Lower the excitation current or use a sensor with a higher dissipation factor if this error is too large."));
   return out;
 }} ,

{id:"snubber", group:"Power", name:"RC snubber & RCD clamp",

         {...F("Lleak","Transformer leakage inductance","H","2u"),showWhen:{k:"kind",is:"RCD clamp"}},

 run(v){
   if(v.kind==="RC snubber"){

     const cTotal=Cpar+Csnub, fr=1/(2*Math.PI*Math.sqrt(Lstray*cTotal));

     return [R("Total node capacitance",cTotal,"F","existing node capacitance + the snubber capacitor"),
             R("Ringing frequency",fr,"Hz","1 ÷ (2π√(Lstray × Ctotal)) — from stray inductance and total node capacitance"),
             R("Snubber characteristic impedance",z0,"Ω","√(Lstray ÷ Csnub)"),
             R("Critical damping resistance",rcrit,"Ω","2 × √(L ÷ C); tune on the measured ringing waveform"),
             R("Selected-to-critical resistance",Rsnub/rcrit,"×","the fitted resistor ÷ the critical value"),
             R("Initial resistor current",Vsw/Rsnub,"A","Vswitch ÷ Rsnub — the instant the node steps"),

   }
   const {Lleak,Ipk,fsRcd,Vclamp,Cclamp,Rclamp}=v;

      Lleak<=0||Ipk<=0||fsRcd<=0||Vclamp<=0||Cclamp<=0||Rclamp<=0) return null;
   const energy=.5*Lleak*Ipk*Ipk, p=energy*fsRcd, iAvg=p/Vclamp, dv=energy/(Cclamp*Vclamp), rNeed=Vclamp*Vclamp/p;

           R("Clamp capacitor ripple",dv,"V","leakage energy ÷ (Cclamp × Vclamp) — approximate change in capacitor voltage per switching event"),

{id:"i2c", group:"Measurement", name:"I²C pull-up & bus capacitance",
 note:[
  "Checks the I\u00b2C pull-up window from bus capacitance, rise time and the guaranteed low-level sink current.",
  "The rise time is the standard 30\u201370 % RC approximation, and the capacitance is the number worth measuring rather than estimating before a design is finished."
 ],
 fields:[F("Vdd","Bus supply","V","3.3"),FS("speed","I²C speed class",["Standard mode (100 kHz)","Fast mode (400 kHz)","Fast-mode Plus (1 MHz)"],"Fast mode (400 kHz)"),
         F("Cbus","Bus capacitance per line","F","200p"),F("Rpull","One fitted pull-up resistor","Ω","4.7k"),F("Npull","Parallel pull-ups per line","×","1"),
         F("Vol","Maximum valid logic-low voltage","V","0.4"),F("Iol","Guaranteed low-level sink current","A","3m")],
 run(v){
   const {Vdd,speed,Cbus,Rpull,Npull,Vol,Iol}=v;
   if(!isFinite(Vdd)||!isFinite(Cbus)||!isFinite(Rpull)||!isFinite(Npull)||!isFinite(Vol)||!isFinite(Iol)||
      Vdd<=0||Cbus<=0||Rpull<=0||Npull<=0||Vol<0||Vol>=Vdd||Iol<=0) return null;
   const trLimit=speed.startsWith("Standard") ? 1e-6 : speed.startsWith("Fast mode") ? 300e-9 : 120e-9;
   const rMin=(Vdd-Vol)/Iol, rMax=trLimit/(0.8473*Cbus), rEff=Rpull/Math.max(1,Math.round(Npull));
   const tr=.8473*rEff*Cbus, iLow=(Vdd-Vol)/rEff, pLow=Vdd*Vdd/rEff;
   const e24=e24AtMost(rMax), windowOk=rMin<=rMax;
   const out=[R("Rise-time limit",trLimit,"s",speed),
              R("Minimum pull-up resistance",rMin,"Ω","(Vdd − VOL) ÷ IOL — below this, a device may not sink the line within VOL"),
              R("Maximum pull-up resistance",rMax,"Ω","rise-time limit ÷ (0.8473 × Cbus) — above this, the RC rise time exceeds the selected I²C limit"),
              R("Effective pull-up resistance",rEff,"Ω","one fitted resistor ÷ number of parallel pull-ups"),
              R("Actual rise time",tr,"s","0.8473 × R × C — the 30–70 % rise of an RC, since ln(0.7 ÷ 0.3) = 0.8473"),
              R("Rise-time utilisation",100*tr/trLimit,"%","actual rise time ÷ the limit × 100"),
              R("Low-level sink current",iLow,"A","(Vdd − VOL) ÷ R, at the entered VOL"),
              R("One-line static low power",pLow,"W","Vdd² ÷ R, while that bus line is held low")];
   if(windowOk) out.push(R("Largest E24 pull-up",e24,"Ω",e24>=rMin?"within the calculated window":"no E24 value fits; reduce bus capacitance or choose another speed class"));
   else out.push(R("Pull-up window",null,"","No valid resistor window: the required sink current and rise time conflict. Reduce bus capacitance, lower the speed, or use an I²C buffer."));
   return out;
 }},

{id:"lcinput", group:"Filters", name:"LC / π input filter",
 note:[
  "Estimates an LC input filter's resonance, damping and attenuation at one noise frequency. A \u03c0 filter adds an input capacitor.",
  "The \u03c0 case is modelled with Cin and Cout in series through the inductor, which is the high-impedance-source limit. A real source sits somewhere between that and a short, where the resonance moves towards L with Cout alone \u2014 so treat the two as the ends of a range rather than one answer, and measure the one you built.",
  "Check the converter's input-impedance stability and the capacitors' ripple-current rating on the real design; neither is visible from here."
 ],
 fields:[FS("kind","Topology",["LC filter","π input filter"],"LC filter"),F("Vnoise","Input noise amplitude","V","1"),F("fnoise","Noise frequency","Hz","100k"),
         F("L","Series inductor","H","10u"),{...F("Cin","Input capacitor for π filter","F","10u"),showWhen:{k:"kind",is:"π input filter"}},
         F("Cout","Output capacitor","F","10u"),F("Rseries","Total series damping resistance","Ω","100m")],
 run(v){
   const {kind,Vnoise,fnoise,L,Cin,Cout,Rseries}=v, pi=kind==="π input filter";
   if(!isFinite(Vnoise)||!isFinite(fnoise)||!isFinite(L)||!isFinite(Cout)||!isFinite(Rseries)||
      Vnoise<0||fnoise<=0||L<=0||Cout<=0||Rseries<=0||(pi&&(!isFinite(Cin)||Cin<=0))) return null;
   const cEq=pi ? Cin*Cout/(Cin+Cout) : Cout, f0=1/(2*Math.PI*Math.sqrt(L*cEq)), z0=Math.sqrt(L/cEq), q=z0/Rseries;
   const ratio=fnoise/f0, gain=1/Math.sqrt(Math.pow(1-ratio*ratio,2)+Math.pow(ratio/q,2)), att=20*Math.log10(gain);
   const out=[R("Effective filter capacitance",cEq,"F", pi ? "Cin \u00d7 Cout \u00f7 (Cin + Cout), the two in series through the inductor \u2014 which assumes the noise source is high-impedance. Driven from a stiff source, Cin is shorted out and the resonance is L with Cout alone" : "the output capacitor alone"),
              R("LC resonant frequency",f0,"Hz","1 \u00f7 (2\u03c0\u221a(L \u00d7 Ceff))"),
              R("Characteristic impedance",z0,"Ω","\u221a(L \u00f7 Ceff)"),
              R("Estimated Q",q,"×","\u221a(L \u00f7 Ceff) \u00f7 R \u2014 uses the entered total series resistance"),
              R("Suggested damping resistance",z0,"Ω","equal to the characteristic impedance: a starting value for a series-RC damping branch, to tune by measurement"),
              R("Estimated noise attenuation",att,"dB","20 log\u2081\u2080 of 1 \u00f7 \u221a((1 \u2212 x\u00b2)\u00b2 + (x \u00f7 Q)\u00b2), with x = f \u00f7 f\u2080 \u2014 a small-signal second-order estimate"),
              R("Estimated output noise",Vnoise*gain,"V","input noise \u00d7 the response at that frequency")];
   if(Math.abs(ratio-1)<0.4&&q>1) out.push(R("Resonance warning",null,"","Noise is near a high-Q LC resonance; add damping and verify the converter remains stable."));
   return out;
 }},

         F("DCR","Winding DCR","Ω","20m"),F("Rth","Inductor thermal resistance","°C/W","25"),F("Tamb","Ambient temperature","°C","25"),F("Tmax","Maximum winding temperature","°C","125"),

 tbl:"inductors",

{id:"bjt", group:"Power", name:"BJT base resistor",

 ],

 run(v){

{id:"rectifier", group:"Power", name:"Bridge rectifier & smoothing capacitor",
 note:[
  "A full-wave bridge recharges the reservoir capacitor twice per mains cycle.",
  "It also estimates transformer VA, regulation, bridge heat and inrush from what you enter \u2014 the transformer and bridge datasheets are what the final choice rests on."
 ],
 fields:[F("Vac","Transformer secondary (RMS)","V","12"),F("fline","Mains frequency","Hz","50"),
         F("I","Load current","A","500m"),F("Vripple","Allowed peak-to-peak ripple","V","1"),
         F("Vd","One diode forward drop","V","0.8"),F("C","Selected reservoir capacitor","F","2200u"),
         F("kripple","Capacitor ripple-current multiplier","×","1.8","1.8",true),
         F("ESR","Capacitor ESR at 100/120 Hz","Ω","100m","100m"),
         F("Rth","Capacitor thermal resistance to ambient","°C/W","20","20"),F("Tamb","Ambient temperature","°C","25","25"),
         F("Tmax","Capacitor maximum temperature","°C","105","105"),F("Irated","Datasheet ripple-current rating (RMS)","A","1","1"),
         F("IsecFactor","Transformer secondary RMS-current multiplier","×","1.8","1.8",true),
         F("Rinrush","Transformer + series resistance","Ω","1","1"),F("Rbridge","Bridge thermal resistance","°C/W","15","15"),
         F("reg","Transformer regulation / no-load rise","%","15","15")],
 tbl:["elec","diodes"],
 run(v){
   const {Vac,fline,I,Vripple,Vd,C,kripple,ESR,Rth,Tamb,Tmax,Irated,IsecFactor,Rinrush,Rbridge,reg} = v;
   if(!isFinite(Vac)||!isFinite(fline)||!isFinite(I)||!isFinite(Vripple)||!isFinite(Vd)||!isFinite(C)||
      !isFinite(kripple)||!isFinite(ESR)||!isFinite(Rth)||!isFinite(Tamb)||!isFinite(Tmax)||!isFinite(Irated)||
      !isFinite(IsecFactor)||!isFinite(Rinrush)||!isFinite(Rbridge)||!isFinite(reg)||
      Vac<=0||fline<=0||I<0||Vripple<=0||C<=0||kripple<=0||ESR<0||Rth<0||Tmax<=Tamb||Irated<=0||
      IsecFactor<=0||Rinrush<=0||Rbridge<0||reg<0) return null;
   const vPeak=Vac*Math.SQRT2-2*Vd;
   if(vPeak<=0) return [R("Bridge output",null,"","two diode drops exceed the transformer peak")];
   const cNeed=I/(2*fline*Vripple), cE24=e24AtLeast(cNeed);
   const ripple=I/(2*fline*C), vMin=vPeak-ripple;
   /* A reservoir capacitor is charged in narrow pulses. Its exact RMS current
      depends on transformer impedance and conduction angle, so the explicit
      multiplier keeps this thermal calculation honest and adjustable. */
   const iCapRms=kripple*I, pESR=iCapRms*iCapRms*ESR, tempRise=pESR*Rth, tCap=Tamb+tempRise;
   const rippleUse=iCapRms/Irated;
   const iSecondary=IsecFactor*I, transformerVA=Vac*iSecondary, bridgeLoss=2*Vd*I;
   const vacNoLoad=Vac*(1+reg/100), acPeak=Vac*Math.SQRT2, acPeakNoLoad=vacNoLoad*Math.SQRT2;
   const vPeakNoLoad=acPeakNoLoad-2*Vd;
   const bridgeTemp=Tamb+bridgeLoss*Rbridge, inrush=acPeakNoLoad/Rinrush;
   let capAdvice;
   if(rippleUse>1 || tCap>Tmax) capAdvice="Not suitable — use a larger or parallel 105°C high-ripple, low-ESR aluminum electrolytic.";
   else if(rippleUse>0.8 || tempRise>10) capAdvice="Use a 105°C high-ripple, low-ESR aluminum electrolytic and keep additional RMS-current margin.";
   else capAdvice="Use a 105°C aluminum electrolytic whose datasheet rating meets the calculated RMS ripple current; low-ESR is preferred.";
   return [R("Peak after bridge",vPeak,"V","transformer RMS × √2 minus two diode drops"),
           R("Capacitance needed",cNeed,"F","Iload ÷ (2 × mains frequency × allowed ripple) — the 2 because a bridge recharges twice per cycle"),
           R("Next E24 capacitance",cE24,"F","round upward for the ripple target"),
           R("Ripple with selected C",ripple,"V","Iload ÷ (2 × mains frequency × C)"),
           R("Minimum DC voltage",vMin,"V","peak after the bridge − the ripple"),
           R("Equivalent load resistance",I>0?vMin/I:Infinity,"Ω","at minimum DC voltage"),
           R("No-load transformer secondary",vacNoLoad,"V","entered rated secondary plus transformer regulation"),
           R("Highest capacitor voltage (nominal mains)",vPeakNoLoad,"V","no-load secondary peak minus two diode drops"),
           R("Suggested capacitor voltage rating",1.25*vPeakNoLoad,"V","25 % margin; also check the highest mains voltage"),
           R("Transformer secondary RMS current",iSecondary,"A","load current × entered capacitor-input multiplier"),
           R("Minimum transformer rating",transformerVA,"VA","at the entered secondary voltage"),
           R("Suggested transformer rating",1.25*transformerVA,"VA","includes a 25 % VA margin"),
           R("Bridge dissipation",bridgeLoss,"W","two diode drops × DC load current"),
           R("Estimated bridge temperature",bridgeTemp,"°C","ambient + bridge loss × bridge thermal resistance"),
           R("Bridge PIV (ideal)",acPeakNoLoad,"V","one no-load secondary peak. A bridge blocks one peak, not two: the conducting pair ties the secondary to the rails, so a blocked diode stands off the DC output and no more. Something close to 2 × Vpeak does appear across a blocked pair in series — which is where the confusion starts — but never across the one diode you are choosing from a catalogue. It is the centre-tapped full-wave and the half-wave that put 2 × Vpeak on a single device"),
           R("Suggested bridge VRRM minimum",2*acPeakNoLoad,"V","2 × the peak above — margin, not physics: the PIV is one peak, and this doubles it for mains excursions and switching spikes. Choose the next standard rating"),
           R("Estimated switch-on inrush",inrush,"A","cold capacitor at zero voltage; transformer impedance must be included"),
           R("Estimated capacitor ripple current",iCapRms,"A","RMS estimate: load current × entered multiplier; verify against the actual transformer and bridge"),
           R("Capacitor ESR dissipation",pESR,"W","I² × ESR, using ESR at the rectifier ripple frequency"),
           R("Estimated capacitor temperature rise",tempRise,"°C","ESR dissipation × thermal resistance to ambient"),
           R("Estimated capacitor core temperature",tCap,"°C","ambient plus estimated self-heating"),
           R("Ripple-current utilisation",100*rippleUse,"%","estimated ripple current \u00f7 the entered rating \u00d7 100 \u2014 must remain below 100 %"),
           R("Capacitor recommendation",null,"",capAdvice)];
 }}
];

NEW_CALCS.concat(WIRE_CALCS, POWER_CALCS, AMP_CALCS, EXTRA_CALCS).forEach(c=>CALCS.push(c));

/* A calculator added later can still belong next to an older one. The rail
   lists each group in array order, so this is where that order is set.   */
function placeAfter(id, after){
  const i = CALCS.findIndex(c=>c.id===id);
  if(i<0 || CALCS.findIndex(c=>c.id===after)<0) return;
  const [moved] = CALCS.splice(i,1);
  CALCS.splice(CALCS.findIndex(c=>c.id===after)+1, 0, moved);
}
placeAfter("sync","boost");
const GROUP_ORDER = ["Basics","Components","Filters","Op-amps","Power","Wire","Measurement"];
CALCS.sort((a,b)=> GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group));

function calcById(id){ return CALCS.find(c=>c.id===id) || CALCS[0]; }
function calcRun(c){
  const raw = ui.calcVals[c.id] || {};
  const v = {};
  c.fields.forEach(f=>{
    if(f.t==="text") v[f.k] = String(raw[f.k]||"").trim();
    else if(f.t==="sel") v[f.k] = (raw[f.k]!==undefined && raw[f.k]!=="") ? raw[f.k] : (f.def||f.opts[0]);
    else if(f.t==="check") v[f.k] = raw[f.k]!==undefined ? raw[f.k]===true || raw[f.k]==="true" : !!f.def;
    else {
      const entered = raw[f.k];
      const fallback = f.def!==undefined ? f.def : entered;
      v[f.k] = parseSI(entered!==undefined && entered!=="" ? entered : fallback, f.unit);
    }
  });
  try{ return c.run(v, raw); }catch(e){ return null; }
}
function calcDiagram(c){
  const f = DIAGRAMS[c.id];
  if(!f) return "";
  try{ return `<div class="schem"><div class="schem-head"><b>Live schematic</b><span>${esc(c.group)} · ${esc(c.id)}</span></div>${f(ui.calcVals[c.id]||{}, calcRun(c))}</div>`; }catch(e){ return ""; }
}
function calcOutHTML(c){
  const rows = calcRun(c);
  if(!rows) return `<p style="color:var(--ink3);font-size:13px;margin:0">Fill the boxes above.</p>`;
  return `<table><tbody>${rows.map(r=>{
      /* a row with no number carries its whole message in the note */
      const bare = (r.value===null || r.value===undefined || r.value==="");
      const val  = bare ? (r.note||"\u2014")
                        : (typeof r.value==="number" ? siFmt(r.value,r.unit)
                                                     : String(r.value)+(r.unit?" "+r.unit:""));
      return `<tr>
      <td style="width:46%">${esc(r.label)}${(!bare && r.note)?`<br><span style="color:var(--ink3);font-size:11px">${esc(r.note)}</span>`:""}</td>
      <td class="m" style="font-size:${bare?"12.5px":"15px"};font-weight:${bare?"400":"600"};color:${bare?"var(--ink2)":"inherit"}">${esc(val)}</td>
    </tr>`;}).join("")}</tbody></table>`;
}

function calcUnitHints(c){
  const seen = new Set(), out = [];
  for(const f of c.fields){
    if(f.t==="sel" || f.t==="text" || f.t==="check") continue;
    const u = String(f.unit||"").trim();
    if(!u || seen.has(u)) continue;
    seen.add(u);
    out.push((f.ph && /^[\d.]/.test(f.ph) ? f.ph : "10") + u);
  }
  return out;
}

function calcSeed(c){
  if(ui.calcVals[c.id]) return;
  const v = {};
  c.fields.forEach(f=>{ if(f.ph !== undefined && f.ph !== "") v[f.k] = String(f.ph); });
  ui.calcVals[c.id] = v;
}

function viewCalc(){
  const c = calcById(ui.calc);

  const shownFields = c.fields.filter(f=>{
    if(!f.showWhen) return true;
    /* A string retains the old checkbox behaviour.  Select-driven fields use
       {k:"field",is:"selected value"}, and fall back to the control's default
       before the page has stored a value for it. */
    if(typeof f.showWhen==="string") return raw[f.showWhen]!==false && raw[f.showWhen]!=="false";
    const control=c.fields.find(x=>x.k===f.showWhen.k);
    const current=raw[f.showWhen.k]!==undefined&&raw[f.showWhen.k]!=="" ? raw[f.showWhen.k] : (control&&(control.def||control.opts&&control.opts[0]));
    return Array.isArray(f.showWhen.is) ? f.showWhen.is.includes(current) : current===f.showWhen.is;
  });
  return `<div class="panel"><h2>${esc(c.name)}</h2>
      ${noteHTML(c.note)}
      <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        ${shownFields.map(f=>f.t==="check"
          ? `<div class="f checkfield${f.newRow?" newrow":""}"><label class="checkrow"><input type="checkbox" class="calcin" data-ck="${esc(f.k)}"${(raw[f.k]!==undefined ? raw[f.k]===true || raw[f.k]==="true" : !!f.def)?" checked":""}><span>${esc(f.label)}</span></label></div>`
          : `<div class="f${f.newRow?" newrow":""}${devKeys.has(f.k)?" fromlist":""}">
          <label class="lab">${esc(f.label)}${f.unit?`<span class="field-unit">${esc(f.unit)}</span>`:""}</label>
          ${f.t==="sel"
            ? (()=>{ const own = (c.presets && f.k===c.presetKey) ? Object.keys((ui.userParts||{})[c.id]||{}) : [];
                const opts = f.opts.concat(own.length?["── yours ──"]:[], own);
                const cur = (raw[f.k]!==undefined && raw[f.k]!=="") ? raw[f.k] : (f.def||f.opts[0]);
                return `<select class="calcin" data-ck="${esc(f.k)}">${opts.map(o=>

            : `<input class="calcin" data-ck="${esc(f.k)}" value="${esc(raw[f.k]!==undefined && raw[f.k]!=="" ? raw[f.k] : (f.def!==undefined ? f.def : ""))}" placeholder="${esc(f.ph||"")}"
                 inputmode="text" spellcheck="false" autocomplete="off">`}</div>`).join("")}
      </div>

      <div class="sheetbar"><button class="btn ghost" id="calcClear">Clear</button>
        ${c.presets ? `<button class="btn ghost" id="calcSavePart">Save this device</button>` : ""}
        ${(c.presets && ((ui.userParts||{})[c.id]||{})[raw[c.presetKey]]) ? `<button class="btn ghost" id="calcDropPart">Forget it</button>` : ""}
        <span style="color:var(--ink3);font-size:12px">${(()=>{ const u = calcUnitHints(c);
          return u.length ? `This page takes ${u.map(x=>`<span class="pn">${esc(x)}</span>`).join(" ")}
            — the unit is optional, and understood when it is there. ` : "";})()}Engineering
        notation works: <span class="pn">4k7</span> <span class="pn">100n</span> <span class="pn">10u</span>
        <span class="pn">1M</span> — capital M is mega, small m is milli.</span></div>

    ${[].concat(c.tbl||[]).map(id=>`<div class="panel tblptr"><a class="linkish" href="#tables-${id}"
        data-table="${id}">${esc((tableById(id)||{}).title||"Tables")} →</a></div>`).join("")}`;
