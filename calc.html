<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit Calcs — bench calculators that draw themselves</title>
<meta name="description" content="Forty-one bench calculators, each drawn as a schematic that redraws as you type. One HTML file, no server, no dependencies.">
<style>
:root{
  /* palette: printed bin label on the bench — paper, Kapton amber, ESD blue */
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#16181C; --ink2:#5C636E; --ink3:#8D939C;
  --rule:#DCDAD3; --rule2:#EDEBE5;
  --kapton:#D9871A; --kapton-soft:#FBEBD0;
  --esd:#2F6F8F; --esd-soft:#E4EFF5;
  --alert:#C0304F; --alert-soft:#FBE3E8;
  --ok:#2C7A50;
  --label:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono","DejaVu Sans Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* author rules must not beat the hidden attribute */
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;
     -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

/* ---------- micro label type, the vernacular of a parts bin ---------- */
.lab{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;
     font-size:11px;color:var(--ink3);font-weight:700}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:grid;
     grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
     padding:10px 18px;background:var(--card);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand-mark{font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.18em;
            text-transform:uppercase}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.02em}
.searchwrap{position:relative;max-width:620px}
#q{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--rule);border-radius:2px;
   background:var(--paper);font-family:var(--mono);font-size:14px;outline:0}
#q:focus{border-color:var(--kapton);background:#fff;box-shadow:0 0 0 3px var(--kapton-soft)}
.hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);
      font-size:11px;color:var(--ink3);border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
.views{display:flex;gap:2px}
.views button,.views a{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:12px;
              font-weight:700;color:var(--ink2);padding:8px 11px;border-bottom:2px solid transparent}
/* the one tab that is a different page, so it never takes the current mark */
.views a{text-decoration:none;white-space:nowrap}
.views button:hover,.views a:hover{color:var(--ink)}
.views button.on{color:var(--ink);border-bottom-color:var(--kapton)}

/* ---------- shell ---------- */
main{display:grid;grid-template-columns:236px 1fr;align-items:start;gap:0}
main.solo{grid-template-columns:1fr}   /* About: no rail, so no empty column */
.rail{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto;
      padding:16px 14px 40px;border-right:1px solid var(--rule)}
.stage{padding:16px 18px 60px;min-width:0}

/* ---------- signature: the drawer wall ---------- */
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 20px}
.drawer{position:relative;aspect-ratio:1.35;border:1px solid var(--rule);background:var(--card);
        display:flex;flex-direction:column;justify-content:flex-end;padding:3px 4px;overflow:hidden}
.drawer .fill{position:absolute;left:0;right:0;bottom:0;background:var(--esd-soft)}
.drawer .k{position:relative;font-family:var(--label);font-weight:700;font-size:15px;line-height:1}
.drawer .n{position:relative;font-family:var(--mono);font-size:9px;color:var(--ink3)}
.drawer:hover{border-color:var(--esd)}
.drawer.on{border-color:var(--esd);border-width:2px;padding:2px 3px}
.drawer.on .fill{background:var(--esd);opacity:.16}
.drawer.ghost{border-style:dashed;color:var(--ink3);cursor:pointer}
.drawer.ghost .k{color:var(--kapton)}
.drawer.ghost:hover{border-color:var(--kapton);background:var(--kapton-soft)}

.railsec{margin-bottom:18px}
.railsec h3{margin:0 0 7px;font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 7px;border:1px solid var(--rule);
      background:var(--card);border-radius:2px;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.alert.on{background:var(--alert);border-color:var(--alert)}
.catlist{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.cat{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:12.5px;
     border-radius:2px;text-align:left;width:100%}
.cat span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.cat:hover{background:var(--rule2)}
.cat.on{background:var(--ink);color:#fff}
.cat.on span:last-child{color:#fff;opacity:.65}
.cat.none{color:var(--ink3)}
.cat span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat span:last-child{flex:none}

/* ---------- part rows: printed bin labels ---------- */
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.count{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.grow{flex:1}
select.sel{border:1px solid var(--rule);background:var(--card);padding:5px 8px;font-family:var(--mono);
           font-size:12px;border-radius:2px}
.btn{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:12px;
     border:1.5px solid var(--ink);padding:7px 13px;border-radius:2px;background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.ghost{background:none;color:var(--ink)}
.btn.ghost:hover{background:var(--rule2)}
a.btn{display:inline-block;text-decoration:none}   /* a link wearing a button */

/* ---------- moving a category up or down its list ---------- */
.ord{font-family:var(--mono);font-size:14px;color:var(--ink3);padding:0 4px;line-height:1}
.ord:hover{color:var(--kapton)}
.ord[disabled]{opacity:.22;cursor:default}
.ord[disabled]:hover{color:var(--ink3)}
.grip{color:var(--ink3);cursor:grab;padding:0 2px;font-size:13px;line-height:1;user-select:none}
tr[data-catrow]{cursor:grab}
tr[data-catrow].dragging{opacity:.35}
tr[data-catrow].dropabove td{box-shadow:inset 0 2px 0 var(--kapton)}
tr[data-catrow].dropbelow td{box-shadow:inset 0 -2px 0 var(--kapton)}

.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:56px 1fr auto;background:var(--card);
     border:1px solid var(--rule);border-radius:2px}
.row{cursor:pointer}
.row:hover{border-color:var(--ink3)}
.row:hover .more{color:var(--ink);border-color:var(--ink3)}
.row .tab{background:var(--esd-soft);border-right:1px solid var(--rule);display:flex;
          flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px}
.row .tab b{font-family:var(--label);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--esd)}
.row .tab small{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.row .tab.none{background:var(--rule2)}
.row .tab.none b{color:var(--ink3)}
.row .body{padding:8px 12px;min-width:0}
.line1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pn{font-family:var(--mono);font-size:13.5px;font-weight:600}
.lcsc{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink2);padding:1px 5px;border-radius:2px}
.ds{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:9.5px;
    color:var(--esd);border:1px solid var(--esd);padding:1px 5px;border-radius:2px;text-decoration:none}
.ds:hover{background:var(--esd);color:#fff}
.ds.none{color:var(--ink3);border-color:var(--rule)}      /* nothing saved: the product page instead */
.ds.none:hover{background:var(--ink3);color:#fff;border-color:var(--ink3)}
.mfrtag{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:10.5px;
        color:var(--esd);border:1px solid var(--esd);background:var(--esd-soft);padding:1px 6px;border-radius:2px}
.mfrtag:hover{background:var(--esd);color:#fff}
.val{font-family:var(--mono);font-size:12.5px;color:var(--kapton);font-weight:600}
.line2{margin-top:3px;font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.line2 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dot{color:var(--rule)}
.qty{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 4px;border-left:1px solid var(--rule2)}
.qnum{font-family:var(--mono);font-size:19px;font-weight:600;min-width:52px;text-align:right;
      padding-right:6px;font-variant-numeric:tabular-nums}
.low .qnum{color:var(--alert)}
.low{border-left:3px solid var(--alert)}
.step{width:26px;height:26px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);
      font-size:14px;color:var(--ink2);line-height:1}
.step:hover{border-color:var(--ink);color:var(--ink)}
.more{width:26px;height:26px;color:var(--ink3);font-size:13px;border:1px solid var(--rule);border-radius:2px}
.more:hover{color:var(--ink)}

/* ---------- tables (boxes / duplicates / log) ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule)}
th{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink2);
   text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--rule2);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:0}
td.m,th.m{font-family:var(--mono);font-size:12px}
th.asis{text-transform:none;letter-spacing:.03em;font-size:12px}
td.num,th.num{text-align:right}
td.num{font-variant-numeric:tabular-nums}
.linkish{color:var(--esd);text-decoration:underline;text-underline-offset:2px}
.groupsep td{background:var(--paper);padding:3px}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:14px}
.panel p{margin:6px 0;color:var(--ink2);font-size:13px;max-width:70ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-family:var(--mono);font-size:12px;margin-top:8px}
.kv b{font-weight:600;color:var(--ink2)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}

/* ---------- editor ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,24,28,.42);z-index:50;display:flex;
         align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.sheet{background:var(--card);border:1px solid var(--ink);width:100%;max-width:620px;padding:20px}
.sheet h2{margin:0 0 14px;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px}
.f.wide{grid-column:1/-1}
.form>.f.newrow{grid-column:1}
.form>.f>.lab{height:42px;display:flex;align-items:flex-end;line-height:1.25}
.field-unit{margin-inline-start:7px;white-space:nowrap;font-family:var(--mono);font-size:10.5px;
            font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink3)}
.form>.f>.calcin{height:35px;min-height:35px}
.f.checkfield{justify-content:flex-end}
.checkrow{height:35px;display:flex;align-items:center;gap:8px;font-family:var(--label);text-transform:uppercase;
          letter-spacing:.1em;font-size:11px;color:var(--ink2);font-weight:700;cursor:pointer}
.f .checkrow input.calcin{appearance:auto;width:16px;min-width:16px;height:16px;min-height:16px;margin:0;padding:0;
                           accent-color:var(--kapton)}
.f input,.f select,.f textarea{border:1px solid var(--rule);background:var(--paper);padding:7px 9px;
                               font-family:var(--mono);font-size:13px;border-radius:2px;outline:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--kapton);background:#fff}
/* Two kinds of box on a page with a device list: the ones the list fills,
   and the ones only the board can answer. Tinting the first leaves the
   second plain, which is the pair you have to fill in yourself.        */
.tblptr{padding:11px 16px;font-size:13px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll>table{width:max-content;min-width:100%}
.notelist{margin:0 0 12px;padding-left:17px;color:var(--ink2);font-size:13px;line-height:1.6}
.notelist li{margin:3px 0}
.notelist li::marker{color:var(--ink3)}
.f.fromlist input,.f.fromlist select{background:var(--esd-soft);border-color:#CBDDE7}
.f.fromlist input:focus,.f.fromlist select:focus{background:#fff}
.f.fromlist>.lab{color:var(--esd)}
.listkey{font-size:11px;color:var(--ink3);margin:2px 0 8px}
.listkey b{display:inline-block;width:11px;height:11px;border-radius:2px;
           background:var(--esd-soft);border:1px solid #CBDDE7;vertical-align:-1px;margin-right:4px}
.f small{color:var(--ink3);font-size:11px}
.sheetbar{display:flex;gap:8px;margin-top:16px;align-items:center}
.danger{color:var(--alert);border-color:var(--alert);background:none}
.danger:hover{background:var(--alert-soft)}

/* ---------- the LCSC lookup sitting in the editor ---------- */
.lcscrow{display:flex;gap:6px}
.lcscrow input{flex:1;min-width:0}
.lcscrow .btn{white-space:nowrap;font-size:10px;padding:0 10px;border-width:1px}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:hover{background:var(--ink)}
.btn.ghost[disabled]:hover{background:none}
.lcscnote{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.65}
.lcscnote:empty{display:none}
.lcscnote b{color:var(--ink);font-weight:600}
.lcscnote .bad{color:var(--alert)}
/* a value LCSC offers for a field already filled in - never taken unasked */
.take{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);background:var(--paper);
      padding:2px 7px;border-radius:2px;margin:3px 4px 0 0;display:inline-block;color:var(--ink)}
.take:hover{border-color:var(--kapton);background:#fff}
.take em{font-style:normal;color:var(--ink3)}
.take.gone{opacity:.45;text-decoration:line-through}
.f input.fresh,.f select.fresh{background:var(--kapton-soft);border-color:var(--kapton)}

.fatal{margin:18px;padding:14px 16px;border:2px solid var(--alert);background:var(--alert-soft);
       font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
       padding:9px 16px;border-radius:2px;font-family:var(--mono);font-size:12.5px;z-index:60;
       display:flex;align-items:center;gap:14px}
.toast .undo{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
             font-size:11px;color:var(--kapton);border:1px solid var(--kapton);padding:3px 9px;border-radius:2px}
.toast .undo:hover{background:var(--kapton);color:var(--ink)}
.noresult{padding:40px 4px;color:var(--ink2)}
.noresult b{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;
         font-size:15px;color:var(--ink);margin-bottom:4px}

.stockbtn{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;
           font-size:10px;border:1px solid currentColor;padding:2px 7px;border-radius:2px;background:none}
.stockbtn:hover{background:var(--rule2)}
.schem{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--rule);margin-bottom:14px;
       padding:35px 14px 14px;border-radius:3px;background-color:var(--paper);
       background-image:radial-gradient(circle at 1px 1px,var(--rule2) .8px,transparent .9px);
       background-size:12px 12px}
.schem-head{position:absolute;z-index:1;top:10px;left:13px;right:13px;display:flex;align-items:center;
            justify-content:space-between;gap:12px;padding-bottom:7px;border-bottom:1px solid var(--rule2);
            font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--ink2)}
.schem-head b{display:flex;align-items:center;gap:6px;color:var(--ink)}
.schem-head b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--kapton);box-shadow:0 0 0 3px var(--kapton-soft)}
.schem-head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink3)}
.schem svg{position:relative;z-index:0;width:100%;max-height:340px}
.schem svg .diagram-canvas{fill:rgba(255,255,255,.42);stroke:var(--rule2);stroke-width:1}
.schem svg .diagram-wire{stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.schem svg .diagram-node{stroke:var(--paper);stroke-width:1.2;vector-effect:non-scaling-stroke}
.schem svg .diagram-part{stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(22,24,28,.10))}
.schem svg .diagram-part:not(path){fill:var(--esd-soft)}
.schem svg path.diagram-part,.schem svg .diagram-accent{stroke:var(--esd)}
.schem svg .diagram-diode{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.schem svg .diagram-arrow-head{filter:drop-shadow(0 1px 0 rgba(22,24,28,.10))}
.schem svg .diagram-text{paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.schem svg .diagram-value{font-weight:700;letter-spacing:.01em}
.schem svg .diagram-node-label{font-weight:700;letter-spacing:.035em}
@media print{ .schem{border-color:#000;background:#fff;padding-top:16px}.schem-head{display:none} }

.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.label{border:1px solid var(--ink);background:var(--card);padding:8px 10px;break-inside:avoid}
.label-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);
         padding-bottom:4px;margin-bottom:5px}
.label-h b{font-family:var(--label);font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1}
.label-h span{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.label ul{list-style:none;margin:0;padding:0}
.label li{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:10px;line-height:1.45;
          border-bottom:1px dotted var(--rule2);padding:1px 0}
.label li span{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label li em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:9px}
.label li b{font-family:var(--mono);font-weight:600;min-width:34px;text-align:right}

@media print{
  .top,.rail,.noprint{display:none!important}
  main{display:block}
  .stage{padding:0}
  body{background:#fff}
  .labels{grid-template-columns:repeat(3,1fr);gap:6px}
  .label{border-color:#000}
  @page{margin:10mm}
}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  .wall{grid-template-columns:repeat(8,1fr)}
  .top{grid-template-columns:1fr;gap:10px}
  .views{overflow:auto}
}
@media (prefers-reduced-motion:no-preference){
  .row{transition:border-color .12s ease}
  .drawer{transition:border-color .12s ease}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-mark">Circuit Calcs</span>
    <span class="brand-sub">thirty-seven, each drawn as a schematic</span>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="divider   ·   trace width   ·   AWG   ·   buck" autocomplete="off" spellcheck="false">
    <span class="hint">/</span>
  </div>
  <nav class="views" id="views">
    <button data-view="calc" class="on">Calculators</button>
    <button data-view="tables">Tables</button>
    <button data-view="about">About</button>
    <a id="binLink" href="https://ajengineering.github.io/parts-bin-app/" target="_blank"
       rel="noreferrer" title="the component inventory these came out of">Parts Bin &#8599;</a>
  </nav>
</header>

<main>
  <aside class="rail" id="rail">
    <div class="railsec">
      <h3 class="lab" id="catHead">Formulas</h3>
      <div class="catlist" id="cats"></div>
    </div>
  </aside>
  <section class="stage" id="stage"></section>
</main>

function toast(msg, undoLabel, undoFn){

function load(){

/* ---------------------------------------------------------- calculators ---
   Engineering notation in and out. Input is case sensitive on purpose, the
   way a schematic is: M is mega, m is milli. A letter may also stand in for
   the decimal point, so 4k7 is 4700 and 1R2 is 1.2.                        */
const SI_IN = {p:1e-12, n:1e-9, u:1e-6, "\u00b5":1e-6, m:1e-3, R:1, r:1, E:1,
               k:1e3, K:1e3, M:1e6, G:1e9, T:1e12};
/* Units a field may be labelled with, longest first, so "\u00b0C/W" is taken off
   before "\u00b0C" and "mm\u00b2" before "mm". Stripped only from the end: a unit in
   the middle of a number is not a unit.

   A bare trailing m is deliberately absent. It is milli far more often than
   it is metres, and the hint under the boxes says so; taking it as a unit
   would quietly turn 100m into a tenth of what was meant.                 */
const UNIT_TAIL = /(?:\u00b0C\/W|mm\u00b2|\u00b0C|Hz|Ah|Wh|VA|oz|mm)$/;
/* `unit` is the label on the field being read, and it settles the one case
   nothing else can: the m in "15m". In a field measured in metres that is
   fifteen metres; anywhere else it is fifteen thousandths. Knowing which
   field asked is the only way to tell, so the field says.                */
function parseSI(v, unit){
  let s = String(v==null?"":v).trim();
  const u = String(unit==null?"":unit).trim();
  if(u && s.length > u.length && s.slice(-u.length) === u) s = s.slice(0, -u.length).trim();
  const t = s.replace(UNIT_TAIL,"").replace(/[\s\u03a9FHAVWsC%\u00b0\u00d7\u00b2]/g,"");
  if(t==="") return NaN;
  const m = /^(-?\d*\.?\d*)([pnu\u00b5mRrEkKMGT])?(\d*)$/.exec(t);
  if(!m) return Number(t);
  let whole = m[1];
  if(m[3] && m[2]) whole = whole + "." + m[3];
  const n = parseFloat(whole);
  if(!isFinite(n)) return NaN;
  return n * (m[2] ? SI_IN[m[2]] : 1);
}
const SI_OUT = [[1e12,"T"],[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],
                [1e-6,"\u00b5"],[1e-9,"n"],[1e-12,"p"]];
/* Only physical base units take a prefix. A percentage, a temperature, a
   gain or a count must never come out as "500 m%" or "1.04 kmin".          */
const SI_UNITS = {"V":1,"A":1,"\u03a9":1,"W":1,"F":1,"H":1,"Hz":1,"s":1,"Wh":1,"VA":1,"Ah":1,
                  "V/√Hz":1,"A/√Hz":1,"A²s":1};
function siFmt(n, unit){
  if(n===null || n===undefined || !isFinite(n)) return "\u2014";
  const u = unit||"";
  if(!SI_UNITS[u]){
    const a0 = Math.abs(n);
    const txt = a0>=1000 ? n.toFixed(0) : a0>=100 ? n.toFixed(1) : a0>=1 ? n.toFixed(2) :
                a0>=0.01 ? n.toFixed(3) : n.toPrecision(3);
    return String(txt).replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"") + (u?" "+u:"");
  }
  if(n===0) return "0 " + u;
  const a = Math.abs(n);
  let step = SI_OUT[SI_OUT.length-1];
  for(const s of SI_OUT) if(a >= s[0]){ step = s; break; }
  const val = n/step[0];
  const txt = Math.abs(val)>=100 ? val.toFixed(1) : Math.abs(val)>=10 ? val.toFixed(2) : val.toFixed(3);
  return txt.replace(/\.?0+$/,"") + " " + step[1] + (unit||"");
}
/* nearest standard value, for a resistor or capacitor that has to be bought */
const E24 = [10,11,12,13,15,16,18,20,22,24,27,30,33,36,39,43,47,51,56,62,68,75,82,91];
function nearestE24(x){
  if(!isFinite(x) || x<=0) return NaN;
  const dec = Math.floor(Math.log10(x));
  let best = null, bd = Infinity;
  for(const d of [dec-1, dec, dec+1]) for(const e of E24){
    const v = e * Math.pow(10, d-1);
    const diff = Math.abs(v-x);
    if(diff < bd){ bd = diff; best = v; }
  }
  return best;
}
/* For a base resistor we must never round upward and starve the transistor of
   drive; for a reservoir capacitor we must never round downward and lose the
   ripple target. These are the two safe directions through the same E24 set. */
function e24AtMost(x){
  if(!isFinite(x) || x<=0) return NaN;
  const dec = Math.floor(Math.log10(x));
  let best = 0;
  for(const d of [dec-1,dec,dec+1]) for(const e of E24){
    const v = e*Math.pow(10,d-1);
    if(v<=x && v>best) best=v;
  }
  return best || E24[0]*Math.pow(10,dec-2);
}
function e24AtLeast(x){
  if(!isFinite(x) || x<=0) return NaN;
  const dec = Math.floor(Math.log10(x));
  let best = Infinity;
  for(const d of [dec-1,dec,dec+1]) for(const e of E24){
    const v = e*Math.pow(10,d-1);
    if(v>=x && v<best) best=v;
  }
  return best;
}
/* `def` is used only when a field is absent or blank. This lets a calculator
   gain an optional engineering check without breaking values saved earlier. */
const F  = (k,label,unit,ph,def,newRow)=>({k,label,unit,ph,def,newRow}); /* engineering number */
const FT = (k,label,ph)=>({k,label,ph,t:"text"});             /* raw text, not parsed */
const FS = (k,label,opts,def)=>({k,label,opts,def,t:"sel"});  /* dropdown */
const FC = (k,label,def)=>({k,label,def,t:"check"});           /* checkbox */
const R = (label,value,unit,note)=>({label,value,unit,note});
/* same, but the value names a part you might already own */
const RP = (label,value,unit,note)=>({label,value,unit,note,find:true});
/* Closed-form fits used by KiCad for IPC-2152 trace-current data. They give
   a useful first pass; the finished board stack-up and copper planes still
   need to be checked with the PCB fabricator for a release design. */
const PCB_CU_UM_PER_OZ = 34.8;
const PCB_TRACE_FIT = {
  External:{K:215.3,a:2,b:-1.15,c:-1.0},
  Internal:{
    0.5:{K:120,a:2,b:-1.10,c:-1.52}, 1:{K:200,a:1.9,b:-1.10,c:-1.52},
    2:{K:300,a:2,b:-1.15,c:-1.52}, 3:{K:262.5,a:1.9,b:-1.15,c:-1.52}
  }
};
function pcbTraceFit(layer, oz){
  if(layer==="External") return PCB_TRACE_FIT.External;
  const weights = [0.5,1,2,3];
  const nearest = weights.reduce((best,w)=>Math.abs(w-oz)<Math.abs(best-oz)?w:best, weights[0]);
  return PCB_TRACE_FIT.Internal[nearest];
}
/* IEC 60751 Callendar–Van Dusen coefficients for platinum RTDs.  The fourth
   order term is needed only below 0 °C, so the positive-temperature inverse
   stays a simple quadratic; a bounded bisection is used below freezing. */
const RTD_A = 3.9083e-3, RTD_B = -5.775e-7, RTD_C = -4.183e-12;
function rtdResistance(t, r0){
  return r0*(1 + RTD_A*t + RTD_B*t*t + (t<0 ? RTD_C*(t-100)*t*t*t : 0));
}
function rtdSensitivity(t, r0){
  return r0*(RTD_A + 2*RTD_B*t + (t<0 ? RTD_C*(4*t*t*t-300*t*t) : 0));
}
function rtdTemperature(r, r0){
  const rMin=rtdResistance(-200,r0), rMax=rtdResistance(850,r0);
  if(!isFinite(r) || r<rMin || r>rMax) return NaN;
  if(r>=r0){
    const d=RTD_A*RTD_A-4*RTD_B*(1-r/r0);
    return d>=0 ? (-RTD_A+Math.sqrt(d))/(2*RTD_B) : NaN;
  }
  let lo=-200, hi=0;
  for(let i=0;i<56;i++){
    const mid=(lo+hi)/2;
    if(rtdResistance(mid,r0)<r) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function ntcResistance(t, r25, beta){
  return r25*Math.exp(beta*(1/(t+273.15)-1/298.15));
}
function ntcTemperature(r, r25, beta){
  return 1/(1/298.15 + Math.log(r/r25)/beta)-273.15;
}
function ntcSensitivity(t, r, beta){ return -beta*r/Math.pow(t+273.15,2); }
const CALCS = [
{id:"ohm", group:"Basics", name:"Ohm's law & power",
 note:["Fill any two boxes. The other two follow."],
 fields:[F("V","Voltage","V","12"),F("I","Current","A","0.5"),F("R","Resistance","\u03a9","24"),F("P","Power","W","6")],
 run(v){
   let {V,I,R:r,P} = v;
   const has = x=>isFinite(x) && x!==0 || x===0 && isFinite(x);
   /* Only the two that were worked out carry a relation. The two you typed
      were not derived from anything, so they say nothing.                */
   let how = {};
   if(has(V)&&has(I)){ r=V/I; P=V*I; how={R:"V \u00f7 I", P:"V \u00d7 I"}; }
   else if(has(V)&&has(r)){ I=V/r; P=V*V/r; how={I:"V \u00f7 R", P:"V\u00b2 \u00f7 R"}; }
   else if(has(V)&&has(P)){ I=P/V; r=V*V/P; how={I:"P \u00f7 V", R:"V\u00b2 \u00f7 P"}; }
   else if(has(I)&&has(r)){ V=I*r; P=I*I*r; how={V:"I \u00d7 R", P:"I\u00b2 \u00d7 R"}; }
   else if(has(I)&&has(P)){ V=P/I; r=P/(I*I); how={V:"P \u00f7 I", R:"P \u00f7 I\u00b2"}; }
   else if(has(r)&&has(P)){ V=Math.sqrt(P*r); I=Math.sqrt(P/r); how={V:"\u221a(P \u00d7 R)", I:"\u221a(P \u00f7 R)"}; }
   else return null;
   return [R("Voltage",V,"V",how.V),R("Current",I,"A",how.I),
           R("Resistance",r,"\u03a9",how.R),R("Power",P,"W",how.P)];
 }},

{id:"led", group:"Basics", name:"LED series resistor",
 fields:[F("Vs","Supply","V","5"),F("Vf","LED forward drop","V","2.1"),F("If","LED current","A","10m")],
 tbl:"leds",
 run(v){
   const {Vs,Vf,If} = v;
   if(!isFinite(Vs)||!isFinite(Vf)||!isFinite(If)||If<=0) return null;
   if(Vf>=Vs) return [R("Resistor","\u2014","","the supply must exceed the forward drop")];
   const r = (Vs-Vf)/If, e = nearestE24(r);
   return [R("Resistor",r,"\u03a9","(Vs \u2212 Vf) \u00f7 If"),RP("Nearest E24",e,"\u03a9"),
           R("Current with E24",(Vs-Vf)/e,"A","(Vs \u2212 Vf) \u00f7 the E24 value"),
           R("Dissipation",(Vs-Vf)*(Vs-Vf)/e,"W","(Vs \u2212 Vf)\u00b2 \u00f7 R \u2014 pick a part rated at least twice this")];
 }},

{id:"rc", group:"Filters", name:"Passive filters",
 note:[
  "Choose the transfer function first, then the part values and the test frequency.",
  "RC and RL are first-order. The RLC options are series-resonant: band-pass taken across R, band-stop across L + C."
 ],

         F("R","Series / load resistance","Ω","10k"),
         {...F("C","Capacitance","F","100n"),showWhen:{k:"type",is:["RC low-pass","RC high-pass","RLC band-pass","RLC band-stop"]}},
         {...F("L","Inductance","H","10m","10m"),showWhen:{k:"type",is:["RL low-pass","RL high-pass","RLC band-pass","RLC band-stop"]}},
         F("f","Test frequency","Hz","1k"),F("Vpp","Input, peak to peak (optional)","V","")],
 run(v){
   const {type,R:r,C,L,f,Vpp}=v;
   /* what the scope would show: the magnitude already worked out, applied to
      whatever amplitude is going in. Left out entirely when none is given. */
   const swing = m => (isFinite(Vpp) && Vpp>0) ? [R("Output, peak to peak",Vpp*m,"V","input \u00d7 magnitude, at the test frequency")] : [];
   const rc=type.startsWith("RC"), rl=type==="RL low-pass"||type==="RL high-pass", rlc=type.startsWith("RLC"), high=type.includes("high"), stop=type.includes("stop");
   if(!isFinite(r)||!isFinite(f)||r<=0||f<=0||(rc&&(!isFinite(C)||C<=0))||(rl&&(!isFinite(L)||L<=0))||(rlc&&(!isFinite(L)||!isFinite(C)||L<=0||C<=0))) return null;
   const w=2*Math.PI*f;
   if(rc||rl){
     const tau=rc ? r*C : L/r, fc=1/(2*Math.PI*tau), x=w*tau;

     const phase=(high ? Math.PI/2-Math.atan(x) : -Math.atan(x))*180/Math.PI;

             R("Time constant τ",tau,"s", rc ? "R \u00d7 C" : "L \u00f7 R"),
             R(reactanceLabel,reactance,"Ω", rc ? "1 \u00f7 (2\u03c0fC)" : "2\u03c0fL"),
             R("Magnitude at test frequency",mag,"×", high ? "x \u00f7 \u221a(1 + x\u00b2), with x = f \u00f7 fc" : "1 \u00f7 \u221a(1 + x\u00b2), with x = f \u00f7 fc"),
             R("Attenuation at test frequency",20*Math.log10(mag),"dB","20 log\u2081\u2080(magnitude)"),
             R("Phase at test frequency",phase,"°", high ? "90\u00b0 \u2212 arctan(x)" : "\u2212arctan(x)"),
             R(high?"Step fall to 10 %":"Step rise 10–90 %",2.2*tau,"s","2.2 \u03c4"),
             R("Settle to 99 %",5*tau,"s","5 \u03c4")].concat(swing(mag));
   }

   return [R("Centre frequency f0",f0,"Hz","1 \u00f7 (2\u03c0\u221a(LC))"),
           R("Q factor",q,"×","\u221a(L \u00f7 C) \u00f7 R"),
           R("Bandwidth (−3 dB)",bw,"Hz","f\u2080 \u00f7 Q"),
           R("Characteristic impedance",z0,"Ω","\u221a(L \u00f7 C)"),
           R("Magnitude at test frequency",mag,"×", stop ? "|X| \u00f7 \u221a(R\u00b2 + X\u00b2), with X = 2\u03c0fL \u2212 1 \u00f7 (2\u03c0fC)" : "R \u00f7 \u221a(R\u00b2 + X\u00b2), with X = 2\u03c0fL \u2212 1 \u00f7 (2\u03c0fC)"),
           R("Attenuation at test frequency", nullAtF0 ? null : 20*Math.log10(mag),"dB", nullAtF0

             : "20 log\u2081\u2080(magnitude)"),

             ? "undefined at f\u2080: the output is a null, and a signal of no amplitude has no phase"

             : "X = 0 at f\u2080, so L and C together are a short and R has the whole signal")].concat(swing(mag));
 }},

{id:"activefilter", group:"Filters", name:"Active filters (op-amp)",

 ],
 fields:[FS("type","Filter type",["Buffered RC low-pass","Buffered RC high-pass","Sallen-Key low-pass (equal R,C)","Sallen-Key high-pass (equal R,C)"],"Buffered RC low-pass"),
         F("R","Equal filter resistance R","Ω","10k"),F("C","Equal filter capacitance C","F","10n"),F("Rg","Rg to ground","Ω","10k"),F("Rf","Rf feedback","Ω","10k"),F("f","Test frequency","Hz","1k"),F("Vpp","Input, peak to peak (optional)","V","")],

    ];

             R("Phase at test frequency",(high?Math.PI/2-Math.atan(x):-Math.atan(x))*180/Math.PI,"°", high ? "90\u00b0 \u2212 arctan(x)" : "\u2212arctan(x)")].concat(swing(mag));
   }
   const q=1/(3-K), den=Math.sqrt(Math.pow(1-x*x,2)+Math.pow(x/q,2)), mag=K*(high?x*x:1)/den;
   return [R("Natural frequency f0",f0,"Hz","1 \u00f7 (2\u03c0RC), with R1 = R2 and C1 = C2"),
           R("Sallen-Key Q",q,"×","equal-component approximation: Q = 1 ÷ (3 − K)"),
           R("Passband gain",K,"×","K = 1 + Rf \u00f7 Rg"),
           R("Peak magnitude at f0",K*q,"×","K \u00d7 Q"),
           R("Magnitude at test frequency",mag,"×", high
             ? "K x\u00b2 \u00f7 \u221a((1 \u2212 x\u00b2)\u00b2 + (x \u00f7 Q)\u00b2), with x = f \u00f7 f\u2080"
             : "K \u00f7 \u221a((1 \u2212 x\u00b2)\u00b2 + (x \u00f7 Q)\u00b2), with x = f \u00f7 f\u2080"),
           R("Attenuation at test frequency",20*Math.log10(mag),"dB","20 log\u2081\u2080(magnitude)"),
           R("Estimated bandwidth",f0/q,"Hz","f\u2080 \u00f7 Q")].concat(swing(mag));
 }},

{id:"difflp", group:"Filters", name:"Differential low-pass (difference amp)",
 note:[
  "A difference amplifier with a capacitor across each feedback resistor \u2013 the usual shape of a shunt current sensor. The gain is R2/R1 in the passband and rolls off above 1/(2\u03c0 \u00b7 R2 \u00b7 Cf).",
  "Both legs have to match, capacitors included. A mismatch there is not a gain error you can trim out: it is a common-mode rejection that falls away as the frequency climbs.",
  "The CMRR below is the ceiling the resistors alone set, at DC. The amplifier's own CMRR, the capacitor tolerance and stray capacitance all sit under it \u2013 read it as the best the resistors will allow, not as what the board will do."
 ],
 fields:[F("R1","R1 input, each leg","Ω","20k"),F("R2","R2 feedback, each leg","Ω","1M"),
         F("Cf","Cf across each R2","F","10n"),
         F("f","Test frequency (optional)","Hz",""),
         F("Vin","Differential input, peak to peak (optional)","V","")],
 run(v){
   const {R1,R2,Cf,f,Vin}=v;
   if(!isFinite(R1)||!isFinite(R2)||!isFinite(Cf)||R1<=0||R2<=0||Cf<=0) return null;
   const g=R2/R1, fc=1/(2*Math.PI*R2*Cf);
   const out=[R("Passband gain",g,"×","R2 \u00f7 R1 \u2014 below the corner; above it, see the gain at the test frequency"),
              R("Passband gain",20*Math.log10(g),"dB","20 log\u2081\u2080(gain)"),
              R("Corner frequency (−3 dB)",fc,"Hz","1 \u00f7 (2\u03c0 \u00b7 R2 \u00b7 Cf) \u2014 where Cf's reactance equals R2"),
              R("Time constant τ",R2*Cf,"s","R2 \u00d7 Cf")];
   const hasV = isFinite(Vin) && Vin>0;
   if(isFinite(f)&&f>0){
     const m=g/Math.sqrt(1+Math.pow(f/fc,2));
     out.push(R("Gain at test frequency",m,"×","passband gain \u00f7 \u221a(1 + (f \u00f7 fc)\u00b2)"));
     out.push(R("Response at test frequency",20*Math.log10(m/g),"dB","20 log\u2081\u2080(gain at f \u00f7 passband gain) \u2014 relative to the passband"));
     if(hasV) out.push(R("Output, peak to peak",Vin*m,"V","input \u00d7 the gain at that frequency"));
   }
   if(hasV) out.push(R("Passband output, peak to peak",Vin*g,"V","input \u00d7 passband gain \u2014 check it against the op-amp's output swing"));
   out.push(R("CMRR from 1 % resistor mismatch",20*Math.log10((1+g)/0.04),"dB","20 log\u2081\u2080((1 + gain) \u00f7 0.04), the four resistors each 1 % out. It is the ceiling the resistors alone set, at DC. The amplifier's own CMRR, the capacitor tolerance, stray capacitance and any imbalance in the source all sit under it, and every one of them falls with frequency"));
   return out;
 }},

{id:"lc", group:"Filters", name:"LC resonance",
 fields:[F("L","Inductance","H","10u"),F("C","Capacitance","F","100n"),F("Rs","Series resistance (optional)","\u03a9","0.5")],
 run(v){
   const {L,C,Rs} = v;
   if(!isFinite(L)||!isFinite(C)||L<=0||C<=0) return null;
   const f0 = 1/(2*Math.PI*Math.sqrt(L*C)), Z = Math.sqrt(L/C);
   const out = [R("Resonant frequency",f0,"Hz","1 \u00f7 (2\u03c0\u221a(LC))"),
                R("Characteristic impedance",Z,"\u03a9","\u221a(L \u00f7 C)"),
                R("XL = XC at f0",2*Math.PI*f0*L,"\u03a9","2\u03c0f\u2080L \u2014 and the two cancel, which is what resonance is")];
   if(isFinite(Rs)&&Rs>0){ out.push(R("Q factor",Z/Rs,"","\u221a(L \u00f7 C) \u00f7 Rs"));
                           out.push(R("Bandwidth",f0*Rs/Z,"Hz","f\u2080 \u00f7 Q")); }
   return out;
 }},

{id:"opinv", group:"Op-amps", name:"Inverting amplifier",
 note:["Rin from the source to the inverting input, Rf from the output back to it."],

   if(isFinite(Vin)) out.push(R("Output",g*Vin,"V","gain \u00d7 Vin"));

{id:"opnon", group:"Op-amps", name:"Non-inverting amplifier",

{id:"opdiff", group:"Op-amps", name:"Difference amplifier",
 note:["R1 on each input, R2 as feedback and to ground. Matching sets the common-mode rejection."],

{id:"reg", group:"Power", name:"Adjustable regulator output",

{id:"ldo", group:"Power", name:"Linear regulator dissipation",
 note:["The heat a linear part has to lose, and where that puts the die."],
 fields:[F("Vin","Input","V","12"),F("Vout","Output","V","3.3"),F("Iout","Load current","A","0.5"),

     out.push(R("Current at 125 \u00b0C junction",(125-Ta)/(Rja*(Vin-Vout)),"A","(125 \u2212 Ta) \u00f7 (\u03b8JA \u00d7 (Vin \u2212 Vout)) \u2014 the most this package can pass here"));
   }

{id:"buck", group:"Power", name:"Buck converter",
 fields:[F("Vin","Input","V","12"),F("Vout","Output","V","5"),F("Iout","Load current","A","2"),
          F("f","Switching frequency","Hz","500k"),F("L","Inductor","H","10u"),
          F("Cout","Output capacitor","F","22u"),F("ESR","Capacitor ESR","Ω","20m")],
  run(v){
    const {Vin,Vout,Iout,f,L,Cout,ESR} = v;
    if(!isFinite(Vin)||!isFinite(Vout)||!isFinite(Iout)||!isFinite(f)||!isFinite(L)||
       Vin<=0||Vout<=0||Iout<=0||f<=0||L<=0) return null;
    if(Vout>=Vin) return [R("Topology",null,"","a buck needs Vout below Vin")];
    const D = Vout/Vin;
    const dI = (Vin-Vout)*D/(f*L), iPk=Iout+dI/2, iVal=Iout-dI/2;
    const dVC = isFinite(Cout)&&Cout>0 ? dI/(8*f*Cout) : NaN;
    const dVESR = isFinite(ESR)&&ESR>=0 ? dI*ESR : 0;
    const out = [R("Duty cycle",100*D,"%","Vout \u00f7 Vin \u00d7 100, ideal \u2014 losses push the real one a little higher"),
                 R("Inductor average current",Iout,"A","the load current: a buck's inductor sits in series with the output"),
                 R("Inductor ripple \u0394IL",dI,"A","(Vin \u2212 Vout) \u00d7 D \u00f7 (f \u00d7 L), which is "+(100*dI/Iout).toFixed(1)+" % of load current"),
                 R("Inductor peak current",iPk,"A","average + \u0394IL \u00f7 2 \u2014 the saturation rating must clear this"),
                 R("Inductor valley current",iVal,"A","average \u2212 \u0394IL \u00f7 2"),
                 R("Input RMS ripple current",Iout*Math.sqrt(D*(1-D)),"A","Iout \u00d7 \u221a(D(1 \u2212 D)) \u2014 sets the input capacitor, and it is worst at D = 0.5"),
                 R("Output ripple (capacitive)",dVC,"V","\u0394IL \u00f7 (8 \u00d7 f \u00d7 Cout)"),
                 R("Output ripple (ESR)",dVESR,"V","\u0394IL \u00d7 ESR"),
                 R("Estimated output ripple",isFinite(dVC)?dVC+dVESR:NaN,"V","the two added \u2014 a worst case, since they do not peak at the same instant"),
                 RP("Inductor for 30 % ripple",(Vin-Vout)*D/(f*0.3*Iout),"H","(Vin \u2212 Vout) \u00d7 D \u00f7 (f \u00d7 0.3 \u00d7 Iout)")];
    if(iVal<=0) out.push(R("Mode",null,"","inductor current reaches zero — this is discontinuous mode, so the ripple estimate no longer applies"));
    return out;
  }},

{id:"boost", group:"Power", name:"Boost converter",
 fields:[F("Vin","Input","V","3.7"),F("Vout","Output","V","12"),F("Iout","Load current","A","0.5"),
          F("f","Switching frequency","Hz","500k"),F("L","Inductor","H","10u"),
          F("Cout","Output capacitor","F","47u"),F("ESR","Capacitor ESR","Ω","20m")],
  run(v){
    const {Vin,Vout,Iout,f,L,Cout,ESR} = v;
    if(!isFinite(Vin)||!isFinite(Vout)||!isFinite(Iout)||!isFinite(f)||!isFinite(L)||
       Vin<=0||Vout<=0||Iout<=0||f<=0||L<=0||Vout<=Vin) return null;
    const D = 1 - Vin/Vout;
    const iL=Iout/(1-D), dI=Vin*D/(f*L), iPk=iL+dI/2, iVal=iL-dI/2;
    const dVC=isFinite(Cout)&&Cout>0 ? Iout*D/(f*Cout) : NaN;
    const dVESR=isFinite(ESR)&&ESR>=0 ? iPk*ESR : 0;
    const out = [R("Duty cycle",100*D,"%","(1 \u2212 Vin \u00f7 Vout) \u00d7 100, ideal \u2014 losses push the real one higher"),
                 R("Inductor average current",iL,"A","Iout \u00f7 (1 \u2212 D) \u2014 a boost's inductor carries the input current, which is above the load current"),
                 R("Inductor ripple \u0394IL",dI,"A","Vin \u00d7 D \u00f7 (f \u00d7 L), which is "+(100*dI/iL).toFixed(1)+" % of average current"),
                 R("Inductor peak current",iPk,"A","average + \u0394IL \u00f7 2 \u2014 the switch and diode must clear this"),
                 R("Inductor valley current",iVal,"A","average \u2212 \u0394IL \u00f7 2"),
                 R("Output ripple (capacitive)",dVC,"V","Iout \u00d7 D \u00f7 (f \u00d7 Cout) \u2014 while the switch is on, the capacitor feeds the load alone"),
                 R("Output ripple (ESR)",dVESR,"V","ESR \u00d7 peak inductor current \u2014 not \u0394IL as in a buck: the capacitor carries the whole load while the switch is on, then takes the full inductor current when it opens, so the step across the ESR is the peak"),
                 R("Estimated output ripple",isFinite(dVC)?dVC+dVESR:NaN,"V","the two added \u2014 a worst case, since they do not peak at the same instant"),
                 RP("Inductor for 30 % ripple",Vin*D/(f*0.3*iL),"H","Vin \u00d7 D \u00f7 (f \u00d7 0.3 \u00d7 average current)")];
    if(iVal<=0) out.push(R("Mode",null,"","inductor current reaches zero — this is discontinuous mode, so the ripple estimate no longer applies"));
    return out;
  }},

{id:"shunt", group:"Measurement", name:"Current-sense shunt & ADC",
 note:[
   "Sizes the shunt, the amplifier and the ADC range together. Enter the largest current you intend to measure, not just the current you happen to see now.",
   "The error budget is a first-pass worst-case sum of shunt tolerance, amplifier gain error and input offset. A real design also needs the amplifier's common-mode range, drift and bandwidth.",
   "Use Kelvin traces from the resistor's sense pads to the amplifier. A trace voltage drop added to a few millivolts of shunt signal is indistinguishable from current."
 ],
 fields:[FS("side","Shunt placement",["Low side (return)","High side (supply)"],"Low side (return)"),
         F("I","Maximum current to measure","A","10"),F("Rs","Shunt resistance","\u03a9","5m"),F("G","Amplifier gain","\u00d7","20"),
         F("Vref","ADC full-scale / reference","V","3.3"),F("bits","ADC bits","","12"),
         F("Vos","Amplifier input offset (max)","V","20u","20u",true),F("Gerr","Amplifier gain error (max)","%","0.5"),
         F("Rtol","Shunt tolerance","%","1"),F("Rth","Shunt thermal resistance","\u00b0C/W","50"),F("Ta","Ambient","\u00b0C","40"),
         F("Vbus","Bus voltage for high-side check (optional)","V","12","12"),F("Vcmmax","Amplifier common-mode maximum (optional)","V","26","26")],
 run(v){
   const {side,I,Rs,G,Vref,bits,Vos,Gerr,Rtol,Rth,Ta,Vbus,Vcmmax} = v;
   const i = Math.abs(I), rs = Math.abs(Rs), g = isFinite(G)&&G>0 ? G : 1;
   if(!isFinite(i)||!isFinite(rs)||rs<=0) return null;
   const vs = i*rs, pd = i*i*rs, vout = vs*g;
   const out = [R("Shunt voltage at maximum current",vs,"V","I \u00d7 Rs \u2014 the burden voltage removed from the load path"),
                R("Shunt dissipation",pd,"W","I\u00b2 \u00d7 R at the entered maximum current"),
                R("Suggested shunt power rating",2*pd,"W","minimum 2\u00d7 margin; check pulse and overload ratings too"),
                R("Amplifier output at maximum current",vout,"V","shunt voltage \u00d7 gain \u2014 before the ADC")];
   if(isFinite(Ta)&&isFinite(Rth)&&Rth>=0)
     out.push(R("Estimated shunt temperature",Ta+pd*Rth,"\u00b0C","ambient + dissipation \u00d7 the entered thermal resistance"));
   if(isFinite(Vref)&&Vref>0){
     const full = Vref/(g*rs), reading=100*vout/Vref;
     out.push(R("ADC full-scale current",full,"A", "Vref \u00f7 (gain \u00d7 Rs) \u2014 "+(i>full?"the entered current clips the ADC":"with the entered gain and reference")),
              R("ADC use at maximum current",reading,"%", "amplifier output \u00f7 Vref \u00d7 100 \u2014 "+(reading>100?"over range":"leave headroom for transients and reference tolerance")),
              R("Gain for this current at full scale",Vref/(i*rs),"\u00d7","Vref \u00f7 (I \u00d7 Rs) \u2014 use a little less for headroom"));
     if(isFinite(bits)&&bits>0&&bits<=32){
       const counts=Math.pow(2,Math.round(bits)), lsbV=Vref/counts, lsbI=lsbV/(g*rs);
       out.push(R("ADC LSB at the shunt",lsbV/g,"V","Vref \u00f7 2^bits \u00f7 gain \u2014 input-referred, before amplifier gain"),
                R("Current resolution",lsbI,"A per count","the LSB at the shunt \u00f7 Rs"));
     }
   }
   const eOffset=isFinite(Vos)?Math.abs(Vos)/rs:0;
   const eGain=isFinite(Gerr)?i*Math.abs(Gerr)/100:0;
   const eShunt=isFinite(Rtol)?i*Math.abs(Rtol)/100:0;
   if(isFinite(Vos)||isFinite(Gerr)||isFinite(Rtol)){
     const worst=eOffset+eGain+eShunt;
     out.push(R("Offset-equivalent current error",eOffset,"A","input offset \u00f7 Rs \u2014 the current that would look the same as the offset"),
              R("Gain-equivalent current error",eGain,"A","I \u00d7 gain error, at the entered maximum current"),
              R("Shunt-tolerance current error",eShunt,"A","I \u00d7 shunt tolerance, at the entered maximum current"),
              R("First-pass worst-case DC error",worst,"A","the three added \u2014 a worst case, since they are unlikely to be at their limits together and in the same direction"));
   }
   if(side==="High side (supply)"){
     if(isFinite(Vbus)&&isFinite(Vcmmax)&&Vcmmax>0){
       out.push(R("High-side common-mode use",100*Math.abs(Vbus)/Vcmmax,"% of rating",
         "|Vbus| \u00f7 the amplifier's common-mode rating \u00d7 100 \u2014 "+(Math.abs(Vbus)>Vcmmax?"over the amplifier input common-mode rating":"the shunt sits near the entered bus voltage")));
     }else if(isFinite(Vbus)) out.push(R("High-side common-mode requirement",Math.abs(Vbus),"V","choose an amplifier whose input range includes this voltage with margin"));
   }else{
     out.push(R("Low-side consequence",null,"","the amplifier common-mode is near ground, but the load return rises by the burden voltage"));
   }
   if(vs<0.02) out.push(R("Layout warning",null,"","the sense signal is under 20 mV; Kelvin routing, amplifier offset and thermoelectric junctions now matter materially"));
   return out;
 }},

{id:"trace", group:"Measurement", name:"PCB trace current & width",
 note:[
  "Trace sizing uses KiCad's closed-form fits to the IPC-2152 data.",
  "Copper planes, airflow, whatever sits next to it and the finished stack-up all change the answer, and belong in a conversation with the fabricator."
 ],
 fields:[F("I","Peak / RMS current","A","3"),FS("layer","Copper layer",["External","Internal"],"External"),
         F("oz","Finished copper weight","oz","1"),F("dT","Allowed temperature rise","\u00b0C","20"),
         F("Tamb","Ambient temperature","\u00b0C","25","25"),F("len","Trace length","mm","50","50"),
         F("width","Selected trace width","mm","1","1"),F("V","Rail voltage (optional)","V","5")],
 tbl:"pcb",
 run(v){
   const {I,layer,oz,dT,Tamb,len,width,V} = v;
   if(!isFinite(I)||!isFinite(oz)||!isFinite(dT)||!isFinite(Tamb)||!isFinite(len)||!isFinite(width)||
      I<=0||oz<=0||dT<=0||len<=0||width<=0) return null;
   const fit = pcbTraceFit(layer,oz);
   const thicknessUM = oz*PCB_CU_UM_PER_OZ, thicknessMil = thicknessUM/25.4;
   const widthMil = width/0.0254;
   const traceRise = fit.K*Math.pow(I,fit.a)*Math.pow(widthMil,fit.b)*Math.pow(thicknessMil,fit.c);
   const requiredMil = Math.pow(dT/(fit.K*Math.pow(I,fit.a)*Math.pow(thicknessMil,fit.c)),1/fit.b);
   const requiredWidth = requiredMil*0.0254, recommendedWidth=1.5*requiredWidth;
   const currentAtWidth = Math.pow(dT/(fit.K*Math.pow(widthMil,fit.b)*Math.pow(thicknessMil,fit.c)),1/fit.a);
   const traceTemp = Tamb+traceRise;
   const rhoCu = 1.724e-8*(1+0.00393*(traceTemp-20));
   const traceArea = width*1e-3*thicknessUM*1e-6;
   const traceR = rhoCu*(len*1e-3)/traceArea, traceDrop=I*traceR, tracePower=I*I*traceR;
   const widthVerdict = width<requiredWidth ? "selected trace is narrower than the calculated minimum" : "selected trace meets the entered temperature-rise target";
   const out = [R("Copper thickness",thicknessUM,"\u00b5m","weight \u00d7 34.8 \u00b5m per ounce \u2014 "+oz+" oz finished copper"),
           R("Calculated minimum trace width",requiredWidth,"mm","the same fit solved for width: (\u0394T \u00f7 (K \u00d7 I^a \u00d7 thickness^c))^(1\u00f7b), for the entered current and allowed rise"),
           R("Recommended trace width",recommendedWidth,"mm","1.5\u00d7 calculated minimum for layout margin"),
           R("Trace temperature rise",traceRise,"\u00b0C","K \u00d7 I^a \u00d7 width^b \u00d7 thickness^c, the closed-form fit to IPC-2152 \u2014 "+widthVerdict),

   if(isFinite(V) && V>0) out.splice(8,0,R("Trace voltage drop (%)",100*traceDrop/V,"%","drop \u00f7 rail \u00d7 100"));
   return out;

/* ---------------------------------------------------- schematic drawing ---
   Inline SVG, no images: it scales, it follows the page colours, and the
   value you type appears on the part it belongs to.                        */
const SW = 1.7;
/* Every part declares where its terminals are, so a wire can end exactly on
   one instead of near it. Vertical and horizontal variants are separate
   symbols - a battery drawn on its side and wired upright looks wrong.     */
const RL = 38, RW = 15;                       /* resistor body length, width */

function W(pts,accent){ return `<polyline class="diagram-wire${accent?" diagram-accent":""}" points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="${SW}"/>`; }
function DOT(x,y){ return `<circle class="diagram-node" cx="${x}" cy="${y}" r="3.2" fill="var(--ink)"/>`; }
/* A vertical wire that crosses a horizontal net without an electrical join. */
function JUMPV(x,y,span){
  const s=span||10, chord=2*s-4;
  return `<path class="diagram-wire" d="M ${x} ${y-s} v 2 a 6 6 0 0 1 0 ${chord} v 2" fill="none" stroke="var(--ink)" stroke-width="${SW}"/>`;
}
function TX(x,y,t,anchor,color,size,kind){
  if(t===undefined || t===null || t==="") return "";
  return `<text class="diagram-text${kind?" diagram-"+kind:""}" x="${x}" y="${y}" text-anchor="${anchor||"middle"}" font-family="ui-monospace,monospace"
    font-size="${size||11}" fill="${color||"var(--ink2)"}">${esc(t)}</text>`;
}
function VAL(x,y,t,anchor){ return TX(x,y,t,anchor,"var(--kapton)",11.5,"value"); }
function NODE(x,y,label,anchor){ return TX(x,y,label,anchor||"middle","var(--esd)",11,"node-label"); }

/* horizontal resistor: terminals (x-19,y) and (x+19,y) */
function RESH(x,y,label,val){
  return `<rect class="diagram-part" x="${x-RL/2}" y="${y-RW/2}" width="${RL}" height="${RW}" fill="var(--card)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x,y-14,label) + VAL(x,y+23,val);
}
/* vertical resistor: terminals (x,y-19) and (x,y+19) */
function RESV(x,y,label,val){
  return `<rect class="diagram-part" x="${x-RW/2}" y="${y-RL/2}" width="${RW}" height="${RL}" fill="var(--card)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x+14,y-3,label,"start") + VAL(x+14,y+12,val,"start");
}
/* compact vertical resistor, leaving visible lead wires inside tight rails */
function RESVSHORT(x,y,label,val){
  const h=26;
  return `<rect class="diagram-part" x="${x-RW/2}" y="${y-h/2}" width="${RW}" height="${h}" fill="var(--card)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x+14,y-3,label,"start") + VAL(x+14,y+12,val,"start");
}
/* vertical capacitor: terminals (x,y-4) and (x,y+4) */
function CAPV(x,y,label,val){
  return W([[x-13,y-4],[x+13,y-4]],true) + W([[x-13,y+4],[x+13,y+4]],true)
       + TX(x+19,y-4,label,"start") + VAL(x+19,y+11,val,"start");
}
/* horizontal capacitor: terminals (x-4,y) and (x+4,y) */
function CAPH(x,y,label,val){
  return W([[x-4,y-13],[x-4,y+13]],true) + W([[x+4,y-13],[x+4,y+13]],true)
       + TX(x,y-20,label) + VAL(x,y+28,val);
}
/* horizontal inductor: terminals (x-24,y) and (x+24,y) */
function INDH(x,y,label,val){
  let d = "";
  for(let i=0;i<4;i++) d += `M ${x-24+i*12} ${y} a 6 6 0 0 1 12 0 `;
  return `<path class="diagram-part" d="${d}" fill="none" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x,y-13,label) + VAL(x,y+19,val);
}
/* vertical inductor: terminals (x,y-24) and (x,y+24) */
function INDV(x,y,label,val){
  let d = "";
  for(let i=0;i<4;i++) d += `M ${x} ${y-24+i*12} a 6 6 0 0 0 0 12 `;
  return `<path class="diagram-part" d="${d}" fill="none" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x+14,y-3,label,"start") + VAL(x+14,y+12,val,"start");
}
function GND(x,y){
  return W([[x,y],[x,y+8]]) + W([[x-11,y+8],[x+11,y+8]])
       + W([[x-7,y+12],[x+7,y+12]]) + W([[x-3,y+16],[x+3,y+16]]);
}
/* vertical battery: terminals (x,y-5) top positive, (x,y+5) negative */
function BATTV(x,y,val){
  return W([[x-14,y-5],[x+14,y-5]]) + W([[x-7,y+5],[x+7,y+5]])
       + TX(x-19,y-2,"+","end","var(--ink)",13) + VAL(x+19,y+2,val,"start");
}
/* op-amp: IN- at (x,y-h/2), IN+ at (x,y+h/2), OUT at (x+w,y) */
/* The pins, and the glyphs that name them, sit at half the half-height - not
   on the corners. The triangle is widest at its left edge and narrows to the
   tip, so a glyph at a fixed size and offset runs into the sloping edge once
   the symbol is drawn small. Both scale with it instead, and at the default
   size they land exactly where they always did.                          */
const OPI = (y,hh,top) => y + (top ? -hh/2 : hh/2);
function OPGLYPH(x,y,hh,top,sym){
  const size = Math.max(9, Math.round(hh*0.47)) + (sym==="−" ? 1 : 0);
  const dx   = Math.max(5, Math.round(hh*0.27));
  const by   = Math.max(3, Math.round(hh*0.17));
  return TX(x+dx, OPI(y,hh,top)+by, sym, "start", "var(--ink)", size);
}
function OPAMP(x,y,h){
  const hh = h||30, w = hh*1.75;
  return `<polygon class="diagram-part" points="${x},${y-hh} ${x},${y+hh} ${x+w},${y}" fill="var(--card)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + OPGLYPH(x,y,hh,true,"−") + OPGLYPH(x,y,hh,false,"+");
}
/* Non-inverting input at the upper pin, as used by the Sallen–Key references. */
function OPAMP_PLUS_TOP(x,y,h){
  const hh = h||30, w = hh*1.75;
  return `<polygon class="diagram-part" points="${x},${y-hh} ${x},${y+hh} ${x+w},${y}" fill="var(--card)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + OPGLYPH(x,y,hh,true,"+") + OPGLYPH(x,y,hh,false,"−");
}
const OPO = h => (h||30)*1.75;                 /* output offset of an op-amp */
function BOX(x,y,w,h,title,sub){
  return `<rect class="diagram-part" x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="var(--esd-soft)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + TX(x+w/2,y+h/2+(sub?-2:4),title,"middle","var(--ink)",12)
       + (sub?TX(x+w/2,y+h/2+12,sub,"middle","var(--ink3)",10):"");
}
/* Vertical diode. The cathode bar always sits on the triangle's tip, and the
   tip points the way conventional current flows. Terminals (x,y-8), (x,y+8).
   DIOV_DOWN conducts downward, DIOV_UP conducts upward - a buck freewheel
   diode is the second kind, with its cathode on the switch node.            */
function DIOV_DOWN(x,y){
  return `<polygon class="diagram-part diagram-diode" points="${x-9},${y-8} ${x+9},${y-8} ${x},${y+8}" fill="var(--ink)"/>`
       + W([[x-11,y+8],[x+11,y+8]]);
}
function DIOV_UP(x,y){
  return `<polygon class="diagram-part diagram-diode" points="${x-9},${y+8} ${x+9},${y+8} ${x},${y-8}" fill="var(--ink)"/>`
       + W([[x-11,y-8],[x+11,y-8]]);
}
const DIOV = DIOV_DOWN;

/* Zener, drawn to conduct upward the way a shunt regulator uses it: cathode
   bar on top towards the positive rail, anode at the bottom to ground, and
   the bar's ends bent the opposite way from each other.                     */
function ZENER(x,y){
  return `<polygon class="diagram-part diagram-diode" points="${x-9},${y+8} ${x+9},${y+8} ${x},${y-8}" fill="var(--ink)"/>`
       + W([[x-11,y-8],[x+11,y-8]])
       + W([[x-11,y-8],[x-16,y-13]])
       + W([[x+11,y-8],[x+16,y-3]]);
}
/* horizontal diode, current to the right: terminals (x-8,y) and (x+8,y) */
function DIOH(x,y){
  return `<polygon class="diagram-part diagram-diode" points="${x-8},${y-9} ${x-8},${y+9} ${x+8},${y}" fill="var(--ink)"/>` + W([[x+8,y-10],[x+8,y+10]]);
}
function LEDV(x,y){
  return DIOV(x,y)
    + `<path d="M ${x+13} ${y-9} l 10 -10 M ${x+17} ${y-2} l 10 -10" stroke="var(--kapton)" stroke-width="1.6" fill="none"/>`
    + `<path d="M ${x+23} ${y-19} l -4.5 0.5 M ${x+23} ${y-19} l 0.5 4.5" stroke="var(--kapton)" stroke-width="1.6" fill="none"/>`
    + `<path d="M ${x+27} ${y-12} l -4.5 0.5 M ${x+27} ${y-12} l 0.5 4.5" stroke="var(--kapton)" stroke-width="1.6" fill="none"/>`;
}
/* Enhancement N-channel MOSFET, traced from the supplied reference symbol.
   The arrow joins the body to the source lead and points into the channel.
   Terminals: drain (x+13,y-33), source (x+13,y+33), gate (x-33,y). */
function NFET(x,y){
  const channel=x, node=x+13, gate=x-7, body=x+20;
  return W([[x-33,y],[gate,y]])                                /* gate lead */
       + W([[gate,y-18],[gate,y+18]])                          /* gate plate */
       + W([[channel,y-18],[channel,y-8]])                     /* broken channel */
       + W([[channel,y-5],[channel,y+4]])
       + W([[channel,y+8],[channel,y+18]])
       + W([[node,y-33],[node,y-13],[channel,y-13]])           /* drain */
       + W([[channel,y+13],[node,y+13],[node,y+33]])           /* source */
       + DOT(node,y-13) + DOT(node,y+13)
       + W([[node,y-13],[body,y-13],[body,y-3]])               /* body diode: cathode */
       + `<polygon class="diagram-diode" points="${body},${y-3} ${body-3.3},${y+4} ${body+3.3},${y+4}" fill="var(--ink)"/>`
       + W([[body-5,y-3],[body+5,y-3]])
       + W([[body,y+4],[body,y+13],[node,y+13]])               /* body diode: anode */
       + W([[channel+5,y],[channel+8,y],[channel+8,y+13]])    /* body lead */
       + `<polygon class="diagram-arrow-head" points="${channel+1},${y} ${channel+6},${y-3.2} ${channel+6},${y+3.2}" fill="var(--ink)"/>`;
}
/* NPN transistor used as a low-side switch.  Its geometry follows the
   supplied NPN reference: base bar at left, collector above, emitter below,
   an enclosing device circle, and an emitter arrow pointing out. */
function NPN(x,y){
  const bx = x-12;
  return `<circle cx="${x-1}" cy="${y}" r="27" fill="var(--paper)" stroke="var(--ink)" stroke-width="${SW}"/>`
       + W([[x-32,y],[bx,y]]) + W([[bx,y-18],[bx,y+18]])
       + W([[x,y-30],[x,y-15],[bx,y-7]])
       + W([[x,y+30],[x,y+15],[bx,y+7]])
       + `<polygon class="diagram-arrow-head" points="${x-7},${y+6} ${x+3},${y+16} ${x-8},${y+14}" fill="var(--ink)"/>`;
}

/* switch, terminals (x-16,y) and (x+16,y) */
function SWH(x,y,label){
  return W([[x-16,y],[x-6,y]]) + W([[x-6,y],[x+9,y-12]]) + W([[x+6,y],[x+16,y]])
       + DOT(x-6,y) + DOT(x+6,y) + TX(x,y+19,label);
}
/* Vertical switch, used by the low-side leg of a boost converter. */
function SWV(x,y,label){
  return W([[x,y-16],[x,y-6]]) + W([[x,y-6],[x+12,y+9]]) + W([[x,y+6],[x,y+16]])
       + DOT(x,y-6) + DOT(x,y+6) + TX(x+24,y+4,label,"start");
}
function ARROW(x1,y1,x2,y2,label,color){
  const c = color||"var(--esd)";
  const a = Math.atan2(y2-y1,x2-x1), h = 6;
  const p = `${x2},${y2} ${x2-h*Math.cos(a-0.4)},${y2-h*Math.sin(a-0.4)} ${x2-h*Math.cos(a+0.4)},${y2-h*Math.sin(a+0.4)}`;
  return `<line class="diagram-wire" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5"/>`
       + `<polygon class="diagram-arrow-head" points="${p}" fill="${c}"/>`
       + (!label ? "" : Math.abs(y2-y1) > Math.abs(x2-x1)
           /* vertical: the label goes beside the shaft, not along it */
           ? TX(Math.min(x1,x2)-10,(y1+y2)/2+4,label,"end",c,11)
           : TX((x1+x2)/2,(y1+y2)/2-6,label,"middle",c,11));
}
function SVG(body, w, h){
  const max = Math.max(w,560);
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live circuit diagram"
    style="width:100%;max-width:${max}px;height:auto;display:block;margin:0 auto 4px"><rect class="diagram-canvas" x=".5" y=".5" width="${w-1}" height="${h-1}" rx="2"/><g class="diagram-content">${body}</g></svg>`;

shunt: (r,o) => {
  const high=(r.side||"Low side (return)")==="High side (supply)";
  const source=high
    ? W([[24,52],[81,52]]) + RESH(100,52,"Rshunt",vv(r,"Rs","")) + W([[119,52],[250,52]]) +
      BOX(250,28,72,48,"LOAD",vv(r,"I","")+" A") + W([[322,52],[380,52],[380,176],[24,176]])
    : W([[24,52],[250,52]]) + BOX(250,28,72,48,"LOAD",vv(r,"I","")+" A") +
      W([[322,52],[380,52],[380,176],[119,176]]) + RESH(100,176,"Rshunt",vv(r,"Rs","")) +
      W([[81,176],[24,176]]);
  /* The tap on the more positive end of the shunt goes to the + input:
     the supply side high-side, the load side low-side. The two taps stand
     at x=58 and x=132, clear of the shunt's own label and value, which are
     centred on x=100. The return turns down at x=380, to the right of the
     converter rather than through it.                                     */
  const y = high ? 52 : 176;
  const plus = high ? 58 : 132, minus = high ? 132 : 58;
  const sense = W([[plus,y],[plus,114],[150,114]]) + W([[minus,y],[minus,134],[150,134]]) +
                DOT(plus,y) + DOT(minus,y) +
                TX(146,108,"+","end","var(--ink2)",12) + TX(146,128,"\u2212","end","var(--ink2)",12);
  return SVG(
    source + sense +
    ARROW(38,20,150,20,vv(r,"I","I")) +
    NODE(24,38,"Vbus+","start") + NODE(24,192,"return","start") +
    BOX(150,100,72,48,"INA","G = "+vv(r,"G","")) + W([[222,124],[266,124]]) +
    VAL(244,116,got(o,"Amplifier output at maximum current"),"middle") +
    BOX(266,100,88,48,"ADC",vv(r,"bits","")+" bit") +
    TX(310,164,"Vref "+vv(r,"Vref",""),"middle","var(--kapton)",11) +
    TX(200,218,"Vsense = "+gotv(o,"Shunt voltage at maximum current")+"  \u00b7  Pshunt = "+gotv(o,"Shunt dissipation"),"middle","var(--ink3)",11) +
    TX(200,240,"full scale = "+gotv(o,"ADC full-scale current")+"  \u00b7  LSB = "+gotv(o,"Current resolution"),"middle","var(--kapton)",11.5) +
    TX(200,262,high?"high-side: check the amplifier common-mode rating":"low-side: return rises by the burden voltage","middle","var(--esd)",10.5), 400, 280);
},

   Colour bands, SMD codes and the E-series behind them.                     */
const BAND_COLORS = {
  black:"#1A1A1A", brown:"#7B4A2B", red:"#C0392B", orange:"#E07B20", yellow:"#F0C419",
  green:"#2C7A50", blue:"#2F6F8F", violet:"#7B4B9E", grey:"#8D939C", white:"#F2F2F2",
  gold:"#C9A227", silver:"#B8BCC0", none:"#00000000"
};
const DIGITS = ["black","brown","red","orange","yellow","green","blue","violet","grey","white"];
const MULTS  = {black:1, brown:10, red:100, orange:1e3, yellow:1e4, green:1e5, blue:1e6,
                violet:1e7, grey:1e8, white:1e9, gold:0.1, silver:0.01};
const TOLS   = {brown:1, red:2, green:0.5, blue:0.25, violet:0.1, grey:0.05, gold:5, silver:10, none:20};
const TCS    = {brown:100, red:50, orange:15, yellow:25, blue:10, violet:5, none:0};
const MULT_ORDER = ["black","brown","red","orange","yellow","green","blue","violet","grey","white","gold","silver"];
const TOL_ORDER  = ["gold","silver","brown","red","green","blue","violet","grey","none"];
const TC_ORDER   = ["none","brown","red","orange","yellow","blue","violet"];

/* value -> the bands that would be printed on the part */
function valueToBands(x, nBands){
  if(!isFinite(x) || x<=0) return null;
  const n = nBands===4 ? 2 : 3;
  let exp = Math.floor(Math.log10(x)) - (n-1);
  let mant = Math.round(x / Math.pow(10, exp));
  if(String(mant).length > n){ mant = Math.round(mant/10); exp++; }
  const digits = String(mant).padStart(n,"0").split("").map(d=>DIGITS[+d]);
  let mult = MULT_ORDER.find(k=>Math.abs(MULTS[k]-Math.pow(10,exp)) < Math.pow(10,exp)*1e-9);
  if(!mult) return null;
  return {digits, mult, value: mant*Math.pow(10,exp)};
}

/* EIA-96 mantissa table: the E96 series, in order */
const EIA96 = [100,102,105,107,110,113,115,118,121,124,127,130,133,137,140,143,147,150,154,158,
 162,165,169,174,178,182,187,191,196,200,205,210,215,221,226,232,237,243,249,255,261,267,274,280,
 287,294,301,309,316,324,332,340,348,357,365,374,383,392,402,412,422,432,442,453,464,475,487,499,
 511,523,536,549,562,576,590,604,619,634,649,665,681,698,715,732,750,768,787,806,825,845,866,887,
 909,931,953,976];
const EIA96_MULT = {Z:1e-3, Y:1e-2, R:1e-2, X:1e-1, S:1e-1, A:1, B:10, H:10, C:100, D:1e3, E:1e4, F:1e5};

function decodeSMD(code){
  const t = String(code||"").trim().toUpperCase().replace(/\s/g,"");
  if(!t) return null;
  /* EIA-96: two digits then a multiplier letter */
  let m = /^(\d{2})([ZYRXSABHCDEF])$/.exec(t);
  if(m){
    const idx = parseInt(m[1],10);
    if(idx>=1 && idx<=96) return {v: EIA96[idx-1] * EIA96_MULT[m[2]], how:"EIA-96, 1 % part"};
  }
  /* R notation: 4R7, R47, 10R */
  if(/^[\dR]+$/.test(t) && t.indexOf("R")>=0){
    const n = parseFloat(t.replace("R","."));
    if(isFinite(n)) return {v:n, how:"R marks the decimal point"};
  }
  /* 3 digit: last digit is the number of zeros */
  if(/^\d{3}$/.test(t)) return {v: parseInt(t.slice(0,2),10) * Math.pow(10, +t[2]), how:"3 digit, 5 % part"};
  /* 4 digit: last digit is the number of zeros */
  if(/^\d{4}$/.test(t)) return {v: parseInt(t.slice(0,3),10) * Math.pow(10, +t[3]), how:"4 digit, 1 % part"};
  return null;
}
function encodeSMD(x){
  if(!isFinite(x) || x<=0) return {};
  const out = {};
  /* 3 digit */
  let e3 = Math.floor(Math.log10(x)) - 1;
  if(e3 >= 0 && e3 <= 9){
    const m3 = Math.round(x/Math.pow(10,e3));
    if(m3>=10 && m3<=99) out.d3 = String(m3)+String(e3);
  }
  if(x < 100){
    /* under 100 ohm the marking uses R for the decimal point: 4R7, R47, 10R */
    const t = (x<10 ? x.toFixed(x<1?2:1) : x.toFixed(1)).replace(/\.?0+$/,"");
    out.d3 = (t.indexOf(".")>=0 ? t.replace(".","R") : t+"R").replace(/^0R/,"R");
  }
  /* 4 digit */
  let e4 = Math.floor(Math.log10(x)) - 2;
  if(e4 >= 0 && e4 <= 9){
    const m4 = Math.round(x/Math.pow(10,e4));
    if(m4>=100 && m4<=999) out.d4 = String(m4)+String(e4);
  }
  /* EIA-96 */
  const dec = Math.floor(Math.log10(x));
  const mant = x/Math.pow(10,dec)*100;
  let bi = 0, bd = Infinity;
  EIA96.forEach((v,i)=>{ const d=Math.abs(v-mant); if(d<bd){bd=d; bi=i;} });
  const mult = Math.pow(10, dec-2);
  const letter = Object.keys(EIA96_MULT).find(k=>Math.abs(EIA96_MULT[k]-mult) < mult*1e-9);
  if(letter) out.e96 = String(bi+1).padStart(2,"0") + letter;
  return out;
}
function parseList(t){
  return String(t||"").split(/[,;\s]+/).map(x=>parseSI(x)).filter(x=>isFinite(x) && x!==0);
}

    : `<ul class="notelist">${pts.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`;
}

function capCode(pf){
  if(pf < 10) return String(pf);
  let m = pf, e = 0;

{id:"netcombo", group:"Components", name:"Series & parallel",
 note:["List the parts you have, separated by commas. Resistors and inductors add in series; capacitors add in parallel."],
 fields:[FS("type","Component",["Resistors","Capacitors","Inductors"],"Resistors"),
         FT("list","Values","10k, 22k, 4k7")],
 run(v){
   const xs = parseList(v.list);
   if(!xs.length) return null;
   const sum = xs.reduce((a,b)=>a+b,0);
   const inv = xs.reduce((a,b)=>a + 1/b, 0);
   const cap = v.type==="Capacitors";
   const u = cap ? "F" : v.type==="Inductors" ? "H" : "\u03a9";
   const series   = cap ? 1/inv : sum;
   const parallel = cap ? sum : 1/inv;
   const out = [R("In series",series,u, cap ? "1 \u00f7 \u03a3(1 \u00f7 C) \u2014 capacitors in series add as reciprocals" : "\u03a3 of the values"),
                R("In parallel",parallel,u, cap ? "\u03a3 of the values" : "1 \u00f7 \u03a3(1 \u00f7 x)"),
                R("Parts",xs.length,""),
                R("Largest",Math.max.apply(null,xs),u),R("Smallest",Math.min.apply(null,xs),u)];
   if(!cap && xs.length===2) out.push(R("Divider ratio", xs[1]/(xs[0]+xs[1]), "\u00d7","second \u00f7 (first + second) \u2014 if these two form a divider"));
   return out;
 }},

{id:"react", group:"Components", name:"Reactance Xc and XL",
 note:["What a capacitor or an inductor looks like at one frequency."],
 fields:[F("f","Frequency","Hz","1k"),F("C","Capacitance","F","100n"),F("L","Inductance","H","10u"),
         F("Rs","Series resistance (optional)","Ω","0.5")],
 run(v){
   const {f,C,L,Rs} = v;
   if(!isFinite(f) || f<=0) return null;
   const out = [];
   let xc = null, xl = null;
   if(isFinite(C) && C>0){ xc = 1/(2*Math.PI*f*C); out.push(R("Xc",xc,"\u03a9","1 \u00f7 (2\u03c0fC)")); }
   if(isFinite(L) && L>0){ xl = 2*Math.PI*f*L;     out.push(R("XL",xl,"\u03a9","2\u03c0fL")); }
   if(xc!==null && xl!==null){
     const x = xl - xc;
     out.push(R("Net reactance",x,"\u03a9", "XL \u2212 Xc \u2014 "+(x>0?"inductive":"capacitive")));
     const r = isFinite(Rs)&&Rs>0 ? Rs : 0;
     out.push(R("Impedance",Math.sqrt(r*r + x*x),"\u03a9","\u221a(R\u00b2 + X\u00b2)"));
     out.push(R("Phase",Math.atan2(x, r||1e-12)*180/Math.PI,"\u00b0","arctan(X \u00f7 R) \u2014 voltage against current"));
     out.push(R("Resonates at",1/(2*Math.PI*Math.sqrt(L*C)),"Hz","1 \u00f7 (2\u03c0\u221a(LC))"));
   } else if(xc!==null && isFinite(Rs) && Rs>0){
     out.push(R("Impedance",Math.sqrt(Rs*Rs+xc*xc),"\u03a9","\u221a(R\u00b2 + Xc\u00b2)"));
   }
   return out.length?out:null;
 }},

{id:"zener", group:"Power", name:"Zener shunt regulator",
 note:["Rs feeds both the zener and the load. The zener has to swallow whatever the load does not take."],
 fields:[F("Vin","Input","V","12"),F("Vz","Zener voltage","V","5.1"),F("Rs","Series resistor","Ω","220"),
         F("Il","Load current","A","10m"),F("Pz","Zener power rating","W","0.5")],
 tbl:"zeners",
 run(v){
   const {Vin,Vz,Rs,Il,Pz} = v;
   if(!isFinite(Vin)||!isFinite(Vz)) return null;
   if(Vz>=Vin) return [R("Zener","\u2014","","the input has to sit above the zener voltage")];
   if(!isFinite(Rs)){
     if(!isFinite(Il)) return null;
     /* size Rs so the zener still gets a holding current of 5 mA at full load */
     const r = (Vin-Vz)/(Il+0.005), e = nearestE24(r);
     return [R("Rs needed",r,"\u03a9","(Vin \u2212 Vz) \u00f7 (load + 5 mA) \u2014 keeps 5 mA in the zener at full load"),
             RP("Nearest E24",e,"\u03a9"),R("Total current",(Vin-Vz)/e,"A","(Vin \u2212 Vz) \u00f7 Rs"),
             R("Dissipation in Rs",(Vin-Vz)*(Vin-Vz)/e,"W","(Vin \u2212 Vz)\u00b2 \u00f7 Rs")];
   }
   const It = (Vin-Vz)/Rs;
   const il = isFinite(Il) ? Il : 0;
   const iz = It - il;
   const pz = iz*Vz, prs = It*It*Rs;
   const out = [R("Total current through Rs",It,"A","(Vin \u2212 Vz) \u00f7 Rs \u2014 fixed by Rs, whatever the load does"),
                R("Current in the zener",iz,"A", "total \u2212 load: the zener swallows what the load leaves"+(iz<0.005 ? ", and below 5 mA regulation gets loose" : "")),
                R("Zener dissipation",pz,"W","Vz \u00d7 the zener current"),
                R("Rs dissipation",prs,"W","I\u00b2 \u00d7 Rs \u2014 pick a resistor rated at least twice this"),
                R("Efficiency",100*Vz*il/(Vin*It),"%","Vz \u00d7 load current \u00f7 (Vin \u00d7 total current) \u00d7 100")];
   if(iz<0) out.push(R("Warning",null,"","the load takes more than Rs delivers \u2014 the output will sag below "+siFmt(Vz,"V")));
   if(isFinite(Pz)){
     out.push(R("Zener rating used",100*pz/Pz,"%", "zener dissipation \u00f7 the rating \u00d7 100"+(pz>Pz?" \u2014 over the rating":"")));
     out.push(R("Worst case, no load",(Vin-Vz)/Rs*Vz,"W","Vz \u00d7 (Vin \u2212 Vz) \u00f7 Rs \u2014 what the zener sees if the load disconnects"));
   }
   return out;
 }},

{id:"opspeed", group:"Op-amps", name:"Op-amp bandwidth & slew rate",
 note:["Checks the two speed limits separately: small-signal bandwidth comes from GBW divided by closed-loop noise gain, while large-signal sine waves need adequate slew rate."],
 fields:[F("gain","Closed-loop noise gain","×","10"),F("f","Highest sine frequency","Hz","100k"),
         F("Vpp","Maximum output swing","V","5"),F("tr","Required 10–90 % step rise time (optional)","s","1u"),
         F("margin","GBW margin","×","5"),F("gbw","Candidate GBW (optional)","Hz","10M"),
         F("sr","Candidate slew rate (optional)","V/µs","10")],
 run(v){
   const {gain,f,Vpp,tr,margin,gbw,sr} = v;
   if(!isFinite(gain)||!isFinite(f)||!isFinite(Vpp)||!isFinite(margin)||
      gain<=0||f<=0||Vpp<=0||margin<1) return null;
   const closedLoopBW=f*margin, gbwSine=gain*closedLoopBW;
   const stepBW=isFinite(tr)&&tr>0 ? 0.35/tr : NaN;
   const gbwStep=isFinite(stepBW) ? gain*stepBW*margin : 0;
   const gbwNeed=Math.max(gbwSine,gbwStep);
   const srSine=Math.PI*f*Vpp/1e6;
   const srStep=isFinite(tr)&&tr>0 ? 0.8*Vpp/tr/1e6 : 0;
   const srNeed=Math.max(srSine,srStep);
   const out=[R("Required closed-loop bandwidth",closedLoopBW,"Hz","highest sine frequency \u00d7 margin, "+margin+"× above it"),
              R("GBW needed for sine response",gbwSine,"Hz","closed-loop noise gain × bandwidth"),
              R("GBW needed for step response",gbwStep,"Hz",isFinite(stepBW)?"from 0.35 ÷ rise time":"no rise-time target entered"),
              R("Recommended GBW",gbwNeed,"Hz","the larger of the two above"),
              R("Sine slew rate needed",srSine,"V/µs","π × frequency × output Vpp"),
              R("Step slew rate needed",srStep,"V/µs",isFinite(tr)&&tr>0?"0.8 × Vpp ÷ 10–90 % rise time":"no rise-time target entered"),
              R("Required slew rate",srNeed,"V/µs","the larger of the two above")];
   const gbwOK=!isFinite(gbw)||gbw<=0 || gbw>=gbwNeed;
   const srOK=!isFinite(sr)||sr<=0 || sr>=srNeed;
   if(isFinite(gbw)&&gbw>0) out.push(R("Candidate closed-loop bandwidth",gbw/gain,"Hz","the part's GBW ÷ the noise gain"),
                                      R("GBW margin",gbw/gbwNeed,"×","the part's GBW ÷ what is needed — "+(gbwOK?"meets the entered target":"below the entered target")));
   if(isFinite(sr)&&sr>0) out.push(R("Candidate full-power bandwidth",sr*1e6/(Math.PI*Vpp),"Hz","slew rate ÷ (π × Vpp) — above this the output cannot keep up at full swing"),
                                    R("Slew-rate margin",sr/srNeed,"×","the part's slew rate ÷ what is needed — "+(srOK?"meets the calculated limit":"slew-rate limited")));
   if((isFinite(gbw)&&gbw>0)||(isFinite(sr)&&sr>0))
     out.push(R("Speed verdict",null,"",(gbwOK&&srOK)?"candidate meets both bandwidth and slew-rate targets":"candidate does not meet all entered speed targets"));
   return out;
 }}
];

/* a resistor body with the bands actually painted on it */
function BANDED(x,y,bands,tolBand,tcBand){
  const bw=110, bh=42;
  let g = `<rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="14"
             fill="#E6DCC8" stroke="var(--ink)" stroke-width="${SW}"/>`
        + W([[x-bw/2-34,y],[x-bw/2,y]]) + W([[x+bw/2,y],[x+bw/2+34,y]]);
  const all = bands.concat(tolBand?[tolBand]:[]).concat(tcBand?[tcBand]:[]);
  const n = all.length;
  all.forEach((c,i)=>{
    /* the tolerance band sits apart, at the right hand end */
    const isTail = (tolBand && i>=bands.length);
    const step = (bw-30)/Math.max(1,n);
    const px = isTail ? x + bw/2 - 12 - ((n-1-i)*13) : x - bw/2 + 16 + i*step;
    g += `<rect x="${px-5}" y="${y-bh/2+1}" width="10" height="${bh-2}"
            fill="${BAND_COLORS[c]||"#999"}" stroke="var(--ink3)" stroke-width="0.6"/>`;
  });
  return g;
}
