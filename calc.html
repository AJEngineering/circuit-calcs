function render(){
  /* About is prose about the program, not about any one calculator, so the
     list goes and the text takes the width                               */
  const info = ui.view==="about";
  $("#rail").hidden = info;
  $("#catHead").textContent = ui.view==="tables" ? "Reference" : "Formulas";
  $("main").classList.toggle("solo", info);
  renderRail();
  $("#stage").innerHTML = info ? viewAbout() : ui.view==="tables" ? viewTables() : viewCalc();
  $$("#views button").forEach(b=>b.classList.toggle("on", b.dataset.view===ui.view));
  save();
}

function renderRail(){
  const q = ui.q.trim().toLowerCase();
  /* the same rail, listing sections instead of calculators */
  if(ui.view==="tables"){
    const shown = TABLES.filter(t=>!q || (t.nav+" "+t.title+" "+t.id+" "+t.g).toLowerCase().includes(q));
    $("#cats").innerHTML = !shown.length
      ? `<span style="color:var(--ink3);font-size:12px">Nothing matches "${esc(ui.q.trim())}".</span>`
      : [...new Set(shown.map(t=>t.g))].map(g =>
          `<div class="lab" style="margin:10px 0 4px">${esc(g)}</div>` +
          shown.filter(t=>t.g===g).map(t=>
            `<button class="cat${ui.tableAt===t.id?" on":""}" data-table="${t.id}" title="${esc(t.title)}">
               <span>${esc(t.nav)}</span></button>`).join("")).join("");
    return;
  }
  /* the title is not always what someone types, so the field labels, their
     units and the dropdown entries are searched too - and past that, the
     words below, which appear nowhere in a calculator's own wording. Those
     were measured rather than guessed: every one of them found nothing.   */
  const hay = c => (c.name+" "+c.group+" "+c.id+" "+[].concat(c.note||[]).join(" ")+" "+(ALIAS[c.id]||"")+" "+
    (c.fields||[]).map(f=>f.label+" "+(f.unit||"")+" "+((f.opts||[]).join(" "))).join(" ")).toLowerCase();
  const hit = c => !q || hay(c).includes(q);
  const shown = CALCS.filter(hit);
  if(!shown.length){
    $("#cats").innerHTML = `<span style="color:var(--ink3);font-size:12px">Nothing matches "${esc(ui.q.trim())}".</span>`;
    return;
  }
  const groups = [...new Set(shown.map(c=>c.group))];
  $("#cats").innerHTML = groups.map(g=>
    `<div class="lab" style="margin:10px 0 4px">${esc(g)}</div>` +
    shown.filter(c=>c.group===g).map(c=>
      `<button class="cat${ui.calc===c.id?" on":""}" data-calc="${c.id}" title="${esc(c.name)}">
         <span>${esc(c.name)}</span></button>`).join("")
  ).join("");
}

/* ----------------------------------------------------------------- events */
document.addEventListener("click", ev=>{
  const t = ev.target;
  const vw = t.closest("[data-view]");
  if(vw){
    ui.view = vw.dataset.view;
    if(ui.view==="tables" && !tableById(ui.tableAt)) ui.tableAt = TABLES[0].id;
    location.hash = ui.view==="about" ? "#about" : ui.view==="tables" ? "#tables" : "#"+ui.calc;
    render(); window.scrollTo(0,0);
    return;
  }
  const tb = t.closest("[data-table]");
  if(tb){
    ev.preventDefault();
    ui.view = "tables"; ui.tableAt = tb.dataset.table;
    location.hash = "#tables-" + ui.tableAt;
    render(); scrollToTable();
    return;
  }
  const ck = t.closest("[data-calc]");
  if(ck){ ui.calc = ck.dataset.calc; ui.view = "calc"; render(); window.scrollTo(0,0); return; }
  if(t.id==="calcSavePart"){
    /* A reader's own parts sit beside the built-in list and outlast the
       session. Only the device figures are kept: the circuit around them
       belongs to the board, not to the transistor.                     */
    const c = calcById(ui.calc);
    if(!c.presets) return;
    const sample = c.presets[Object.keys(c.presets)[0]];
    const vals = ui.calcVals[c.id] || {};
    const name = (prompt("Name for this device, as it should read in the list:","") || "").trim();
    if(!name) return;
    if(c.presets[name]) return toast("That name is already in the built-in list");
    const rec = {};
    Object.keys(sample).forEach(k=>{ rec[k] = String(vals[k]||""); });
    ui.userParts[c.id] = ui.userParts[c.id] || {};
    ui.userParts[c.id][name] = rec;
    vals[c.presetKey] = name;
    save(); render();
    toast("Saved "+name+" \u2014 in this browser", "Undo", ()=>{
      delete ui.userParts[c.id][name]; save(); render();
    });
    return;
  }
  if(t.id==="calcDropPart"){
    const c = calcById(ui.calc);
    const vals = ui.calcVals[c.id] || {};
    const name = vals[c.presetKey];
    const rec = ((ui.userParts||{})[c.id]||{})[name];
    if(!rec) return;
    if(!confirm("Forget "+name+"?")) return;
    delete ui.userParts[c.id][name];
    vals[c.presetKey] = c.fields.find(f=>f.k===c.presetKey).opts[0];
    save(); render();
    toast("Forgot "+name, "Undo", ()=>{
      ui.userParts[c.id] = ui.userParts[c.id] || {};
      ui.userParts[c.id][name] = rec;
      vals[c.presetKey] = name; save(); render();
    });
    return;
  }
  if(t.id==="calcClear"){
    delete ui.calcVals[ui.calc];
    render();
    return;
  }
});

const reRun = ()=>{
  const c = calcById(ui.calc);
  const out = $("#calcOut");
  if(out) out.innerHTML = calcDiagram(c) + calcOutHTML(c);
  save();
};
document.addEventListener("input", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){

    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.value;
    reRun();
    return;
  }
  if(ev.target.id==="q"){ ui.q = ev.target.value; renderRail(); }
});
document.addEventListener("change", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){
    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.type==="checkbox" ? ev.target.checked : ev.target.value;

       sensor, or entering inverse RTD mode with an out-of-range saved value,

    if(c.id==="tempsense"){
      const vals=ui.calcVals[c.id], type=vals.sensor||"NTC (Beta)", key=ev.target.dataset.ck;
      const reference=type==="PT1000 (IEC 60751)" ? "1k" : type==="NTC (Beta)" ? "10k" : (vals.R0||"100");
      const r0=type==="PT100 (IEC 60751)" ? 100 : type==="PT1000 (IEC 60751)" ? 1000 : parseSI(vals.R0||"100","Ω");
      const measured=parseSI(vals.Rmeas,"Ω"), lead=parseSI(vals.Rlead||"0","Ω");
      const inverseRTD=key==="mode" && vals.mode==="Resistance → temperature" && type!=="NTC (Beta)";
      const invalidRTD=!isFinite(rtdTemperature(measured-lead,r0));
      if(key==="sensor" || (inverseRTD&&invalidRTD)) vals.Rmeas=reference;
    }
    /* A calculator may carry a table of parts. Choosing one writes the
       figures that belong to the device and leaves everything that
       belongs to the circuit alone - Id, the rail, the frequency and the
       gate drive are yours, not the transistor's. Nothing is locked:
       every field stays editable, because a datasheet figure is quoted at
       conditions that may not be the ones on your bench.               */
    if(c.presets && ev.target.dataset.ck===c.presetKey){
      const p = c.presets[ev.target.value] || ((ui.userParts||{})[c.id]||{})[ev.target.value];
      if(p) Object.keys(p).forEach(k=>{ if(k!=="_note") ui.calcVals[c.id][k]=p[k]; });
    }
    /* Selects can control which fields are relevant, just like checkboxes.
       Rebuild the form so dependent inputs and the live schematic agree. */
    if(ev.target.type==="checkbox" || ev.target.tagName==="SELECT"){ render(); return; }
    reRun();
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault(); $("#q").focus(); $("#q").select(); return;
  }
  if(e.key==="Escape" && e.target.id==="q"){ ui.q=""; $("#q").value=""; renderRail(); }
});

/* A calculator can be linked to directly, so one of these can be sent to
   someone or kept in a browser tab of its own.                            */
function fromHash(){
  const hashId = decodeURIComponent(String(location.hash||"").replace(/^#/,"")).trim();
  const id = hashId==="dividerload" ? "divider" : hashId;
  if(id==="about"){ ui.view = "about"; return true; }
  if(id==="tables"){
    ui.view = "tables";
    if(!tableById(ui.tableAt)) ui.tableAt = TABLES[0].id;
    return true;
  }
  if(id.startsWith("tables-") && tableById(id.slice(7))){
    ui.view = "tables"; ui.tableAt = id.slice(7); return true;
  }
  if(id && CALCS.some(c=>c.id===id)){ ui.calc = id; ui.view = "calc"; return true; }
  return false;
}
function scrollToTable(){ if(ui.view==="tables") window.scrollTo(0,0); }
window.addEventListener("hashchange", ()=>{ if(fromHash()){ render(); scrollToTable(); } });

try{
  load();
  migrateCalculatorIds();
  fromHash();
  render();
  scrollToTable();
}catch(err){
  const d = document.createElement("pre");
  d.className = "fatal";
  d.textContent = "The page could not start:\n" + (err && err.stack ? err.stack : err) +
                  "\n\nSend this text back and it can be fixed.";
  document.body.appendChild(d);
}
</script>
